<style>

<body>
<div id="app"></div>

<script>
/*LOGIC*/
var CATS=[['mercado','Mercado','🛒'],['comida','Comida fora','🍽️'],['transporte','Transporte','🚗'],['casa','Casa','🏠'],['saude','Saúde','💊'],['lazer','Lazer','🎬'],['compras','Compras','🛍️'],['educacao','Educação','📚'],['outros','Outros','•']];
var KW={mercado:['mercado','supermercado','feira','padaria','hortifruti','acougue','atacadao'],comida:['restaurante','lanche','ifood','pizza','cafe','almoco','jantar','bar','sorvete','hamburguer'],transporte:['uber','99','gasolina','combustivel','onibus','metro','estacionamento','pedagio','taxi'],casa:['aluguel','luz','agua','internet','condominio','gas','energia'],saude:['farmacia','remedio','medico','consulta','dentista','exame'],lazer:['cinema','show','netflix','spotify','jogo','streaming','viagem','passeio'],compras:['roupa','sapato','loja','shopee','amazon','presente'],educacao:['curso','escola','livro','faculdade','mensalidade']};
function pad(n){return(n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return ymd(new Date())}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)}
function monthOf(d){return d.slice(0,7)}
function daysInMonth(ym){var p=ym.split('-');return new Date(+p[0],+p[1],0).getDate()}
function addMonths(ym,n){var p=ym.split('-'),d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function monthsBetween(a,b){var x=a.split('-'),y=b.split('-');return(+y[0]-+x[0])*12+(+y[1]-+x[1])}
function fmt(c){if(c==null)return'—';var neg=c<0;c=Math.abs(c);return(neg?'-':'')+'R$ '+String(Math.floor(c/100)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+pad(c%100)}
function toCents(s){var d=String(s==null?'':s).replace(/\D/g,'').slice(0,11);return d?parseInt(d,10):0}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function emptyDb(){return{v:1,recs:[],metas:[],aportes:[],reg:{},onb:false,prem:Object.assign({},PREM_PADRAO),log:[]}}
function sum(a){return a.reduce(function(s,r){return s+r.v},0)}
function catLabel(k){for(var i=0;i<CATS.length;i++)if(CATS[i][0]===k)return CATS[i][1];return'Outros'}
function catIcon(k){for(var i=0;i<CATS.length;i++)if(CATS[i][0]===k)return CATS[i][2];return'•'}

function parseQuick(text,today){
  var t=norm(text||''),raw=String(text||'');
  var data=today;
  if(/\banteontem\b/.test(t))data=addDays(today,-2);else if(/\bontem\b/.test(t))data=addDays(today,-1);
  var dm=t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  if(dm){var y=dm[3]?(dm[3].length===2?2000+ +dm[3]:+dm[3]):+today.slice(0,4),mo=+dm[2],dd=+dm[1];if(mo>=1&&mo<=12&&dd>=1&&dd<=31)data=y+'-'+pad(mo)+'-'+pad(dd)}
  var vd=valorDe(t);if(!vd)return null;var v=vd.v;
  var tipo=/\b(recebi|ganhei|salario|recebimento|entrou|vendi|pix recebido)\b/.test(t)?'r':'d';
  var cat='outros';
  outer:for(var k in KW){for(var i=0;i<KW[k].length;i++){if(new RegExp('\\b'+KW[k][i]+'\\b').test(t)){cat=k;break outer}}}
  var desc=norm(raw).replace(vd.raw,' ').replace(/\b\d{1,2}\/\d{1,2}(\/\d{2,4})?\b/g,' ')
    .replace(/\b(gastei|gasto|paguei|comprei|recebi|ganhei|reais|real|r\$|no|na|nos|nas|de|do|da|em|com|um|uma|hoje|ontem|anteontem|dia|eu|foi|fui|pra|para|por)\b/g,' ').replace(/[^\w\s-]/g,' ').replace(/\s+/g,' ').trim();
  // usa o texto original sem acento quando possível
  if(desc){var words=desc.split(' ');desc=words.join(' ');desc=desc.charAt(0).toUpperCase()+desc.slice(1)}
  else desc=tipo==='r'?'Entrada':catLabel(cat);
  return{v:v,t:tipo,cat:cat,desc:desc.slice(0,60),data:data};
}

function pascoa(y){
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return new Date(y,mes-1,dia);
}
function feriadosNacionais(y){
  var f={},add=function(m,d){f[y+'-'+pad(m)+'-'+pad(d)]=1};
  [[1,1],[4,21],[5,1],[9,7],[10,12],[11,2],[11,15],[11,20],[12,25]].forEach(function(x){add(x[0],x[1])});
  var sx=pascoa(y);sx.setDate(sx.getDate()-2);f[ymd(sx)]=1; // Sexta-feira Santa
  return f;
}
// N-ésimo dia útil do mês (ym). sab=true conta o sábado (regra da CLT para salário); falso = só segunda a sexta.
// Considera só feriados NACIONAIS e a Sexta-feira Santa; feriado estadual/municipal o usuário ajusta na data.
function nEsimoDiaUtil(ym,n,sab){
  var fer=feriadosNacionais(+ym.slice(0,4)),dim=daysInMonth(ym),c=0;
  for(var d=1;d<=dim;d++){
    var dt=ym+'-'+pad(d),w=parseD(dt).getDay();
    if(w===0||(w===6&&!sab)||fer[dt])continue;
    c++;if(c===n)return dt;
  }
  return ym+'-'+pad(dim);
}
function dataRec(t,m){
  if(t.regra&&t.regra.n>0)return nEsimoDiaUtil(m,t.regra.n,!!t.regra.sab);
  return m+'-'+pad(Math.min(+t.data.slice(8,10),daysInMonth(m)));
}
function ensureRecurring(db,today){
  var ym=monthOf(today),added=0;
  db.recs.filter(function(r){return r.rec==='m'&&!r.from}).forEach(function(t){
    if(monthOf(t.data)>=ym)return;
    var exists=db.recs.some(function(r){return(r.from===t.id||r.id===t.id)&&monthOf(r.data)===ym});
    if(exists)return;
    var nova={id:uid(),t:t.t,v:t.v,cat:t.cat,desc:t.desc,data:dataRec(t,ym),st:t.est?'real':'prev',fixa:!!t.fixa,est:!!t.est,rec:'m',from:t.id};
    if(t.regra)nova.regra=t.regra;db.recs.push(nova);
    added++;
  });
  return added;
}

function budgetMes(db,today){
  var ym=monthOf(today),dim=daysInMonth(ym),dia=+today.slice(8,10),diasRest=dim-dia+1;
  var recs=db.recs.filter(function(r){return monthOf(r.data)===ym});
  var renda=sum(recs.filter(function(r){return r.t==='r'}));
  var fixas=sum(recs.filter(function(r){return r.t==='d'&&r.fixa}));
  var vari=recs.filter(function(r){return r.t==='d'&&!r.fixa});
  var variavel=sum(vari);
  var gastoHoje=sum(vari.filter(function(r){return r.data===today}));
  var reserva=db.metas.filter(function(m){return!m.feita}).reduce(function(s,m){return s+(m.mensal||0)},0);
  var out={ym:ym,diasRest:diasRest,renda:renda,fixas:fixas,reserva:reserva,variavel:variavel,gastoHoje:gastoHoje,semRenda:renda===0};
  if(renda===0){out.restante=null;out.limiteDia=null;out.sobraHoje=null;return out}
  var restante=renda-fixas-reserva-variavel;
  var restanteAbertura=restante+gastoHoje;
  out.restante=restante;
  out.limiteDia=restanteAbertura>0?Math.floor(restanteAbertura/diasRest):0;
  out.sobraHoje=out.limiteDia-gastoHoje;
  out.estourou=restante<0?-restante:0;
  return out;
}

/* ===== Modelo de caixa: saldo em conta − o que vence até o próximo recebimento ===== */
function normalizarPts(db,now){
  db.recs.forEach(function(r){
    if(r.st==='real'){if(typeof r.pts!=='number')r.pts=(db.saldoTs==null)?0:now}
    else if(r.pts!=null)delete r.pts;
  });
}
function definirSaldo(db,v,now){normalizarPts(db,now);db.saldo=v;db.saldoTs=now}
function proximoRecebimento(db,today){
  var ym=monthOf(today),c=[];
  db.recs.filter(function(x){return x.t==='r'&&x.st==='prev'&&x.data>today}).forEach(function(x){c.push({data:x.data,desc:x.desc,v:x.v})});
  db.recs.filter(function(t){return t.t==='r'&&t.rec==='m'&&!t.from}).forEach(function(t){
    [ym,addMonths(ym,1)].forEach(function(m){
      if(monthOf(t.data)>m)return;
      if(db.recs.some(function(x){return(x.id===t.id||x.from===t.id)&&monthOf(x.data)===m}))return;
      var d=dataRec(t,m);
      if(d>today)c.push({data:d,desc:t.desc,v:t.v});
    });
  });
  if(!c.length)return{data:addMonths(ym,1)+'-01',itens:[],semData:true};
  var min=c.map(function(x){return x.data}).sort()[0];
  return{data:min,itens:c.filter(function(x){return x.data===min}),semData:false};
}
function proximaRenda(db,today){return proximoRecebimento(db,today).data}
function contasAteRenda(db,today,prox,dias){
  var ym=monthOf(today),total=0,itens=[],estimado=false;
  db.recs.filter(function(r){return r.t==='d'&&r.fixa&&!r.est&&r.st==='prev'&&r.data<prox}).forEach(function(r){total+=r.v;itens.push({desc:r.desc,v:r.v,data:r.data})});
  var tpls=db.recs.filter(function(t){return t.rec==='m'&&!t.from&&t.t==='d'&&t.fixa&&!t.est});
  [ym,addMonths(ym,1)].forEach(function(m){
    tpls.forEach(function(t){
      if(monthOf(t.data)>m)return;
      if(db.recs.some(function(x){return(x.id===t.id||x.from===t.id)&&monthOf(x.data)===m}))return;
      var d=m+'-'+pad(Math.min(+t.data.slice(8,10),daysInMonth(m)));
      if(d>=today&&d<prox){total+=t.v;itens.push({desc:t.desc,v:t.v,data:d})}
    });
  });
  var temFixas=itens.length||db.recs.some(function(r){return r.t==='d'&&r.fixa&&!r.est&&monthOf(r.data)===ym})||tpls.length;
  if(!temFixas){
    var est=db.recs.filter(function(r){return r.est&&monthOf(r.data)===ym});
    if(est.length){total+=Math.round(sum(est)*dias/30);estimado=true}
  }
  return{total:total,itens:itens,estimado:estimado};
}
function budgetCaixa(db,today){
  var ym=monthOf(today),pr=proximoRecebimento(db,today),prox=pr.data,dias=Math.max(1,Math.round((parseD(prox)-parseD(today))/864e5)),ts=db.saldoTs,atual=db.saldo,gastoHoje=0;
  db.recs.forEach(function(r){
    if(r.st!=='real'||r.est||typeof r.pts!=='number'||!(r.pts>ts))return;
    atual+=r.t==='r'?r.v:-r.v;
    if(r.t==='d'&&!r.fixa&&r.data===today)gastoHoje+=r.v;
  });
  (db.aportes||[]).forEach(function(a){if(typeof a.ts==='number'&&a.ts>ts)atual-=a.v});
  var c=contasAteRenda(db,today,prox,dias);
  var reserva=db.metas.filter(function(m){return!m.feita&&m.mensal>0}).reduce(function(s,m){
    var feito=(db.aportes||[]).filter(function(a){return a.plano===m.id&&monthOf(a.data)===ym}).reduce(function(x,a){return x+a.v},0);
    return s+Math.max(0,m.mensal-feito)},0);
  var disp=atual-c.total-reserva,abertura=disp+gastoHoje,limite=Math.max(0,Math.floor(abertura/dias));
  return{modo:'caixa',ym:ym,saldo:atual,proxRenda:prox,proxItens:pr.itens,proxSemData:pr.semData,diasRest:dias,fixas:c.total,fixasItens:c.itens,fixasEstimado:c.estimado,reserva:reserva,
    variavel:0,renda:0,gastoHoje:gastoHoje,semRenda:false,restante:disp,limiteDia:limite,sobraHoje:limite-gastoHoje,estourou:disp<0?-disp:0};
}

function valorDe(t){
  var s=t.replace(/\b\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\b/g,' ').replace(/\bdia\s+\d{1,2}\b/g,' ');
  var m=s.match(/\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?/);
  if(!m)return null;
  var a=m[0],ip,fp='';
  if(a.indexOf(',')>=0){var q=a.split(',');ip=q[0].replace(/\./g,'');fp=q[1]}
  else if(/^\d{1,3}(\.\d{3})+$/.test(a))ip=a.replace(/\./g,'');
  else if(a.indexOf('.')>=0){var q2=a.split('.');ip=q2[0];fp=q2[1]}
  else ip=a;
  var v=parseInt(ip,10)*100+(fp?parseInt((fp+'0').slice(0,2),10):0),raw=a;
  var mult=s.slice(m.index+a.length).match(/^\s*(milhoes|milhao|mil|k)\b/);

function rota(p,today){

  if(p.prazo)r.necessario=Math.ceil(falta/Math.max(1,n));

function simRF(p,A,cdi,pct){

    if(liq>=p.alvo)return{meses:meses,princ:princ,liq:liq};

  }
  if(/\b(paguei|quitei|pago)\b/.test(t)){
    var d=t.replace(vd?vd.raw:'',' ').replace(/\b(paguei|quitei|pago|a|o|conta|da|do|de|reais|real|r\$)\b/g,' ').replace(/\s+/g,' ').trim();
    var c=contas(db,today),todas=c.atrasadas.concat(c.semana,c.depois),fs=d?todas.filter(function(r){return norm(r.desc).indexOf(d)>=0}):[];
    if(fs.length===1)return F('pagar_conta',{descricao:fs[0].desc,id:fs[0].id});
    if(fs.length>1)return{erro:'Mais de uma conta combina: '+fs.map(function(r){return r.desc}).join(', ')+'. Qual?'};
  }
  if(/\b(minhas contas|contas a pagar|contas da semana|o que vence|quais contas)\b/.test(t))return F('listar_contas',{});
  var q=parseQuick(texto,today);
  if(q)return F('registrar_lancamento',{tipo:q.t,valor:q.v,categoria:q.cat,descricao:q.desc,data:q.data});
  return{erro:'Não entendi. Tente: "gastei 50 no mercado", "quanto posso gastar hoje", "criar plano moto 20 mil em 18 meses" ou "guardei 200 na moto".'};
}

function quandoTxt(min,max,today){
  var ym=monthOf(today),lbl=function(n){var x=addMonths(ym,n);return x.slice(5,7)+'/'+x.slice(0,4)};
  if(min===0&&max===0)return'Agora';
  if(min===max)return'em '+min+(min===1?' mês':' meses')+' ('+lbl(min)+')';
  return'entre '+min+' e '+max+' meses ('+lbl(min)+' a '+lbl(max)+')';
}

function executar(db,today,nome,a,origem){
  a=a||{};var out;
  function ok(msg,dados){return{ok:true,mensagem:msg,fala:msg,dados:dados||null}}
  function no(msg){return{ok:false,mensagem:msg,fala:msg,dados:null}}
  function limiteTxt(){var b=budget(db,today);if(b.semRenda)return'';return b.sobraHoje>=0?' Ainda pode gastar '+fmt(b.sobraHoje)+' hoje.':' Passou '+fmt(-b.sobraHoje)+' do limite de hoje.'}
  switch(nome){
    case'registrar_lancamento':{
      if(!Number.isInteger(a.valor)||a.valor<=0)return no('Valor inválido.');
      var dt=/^\d{4}-\d{2}-\d{2}$/.test(a.data||'')?a.data:today,tp=a.tipo==='r'?'r':'d';
      db.recs.push({id:uid(),t:tp,v:a.valor,cat:tp==='d'?(catLabel(a.categoria)==='Outros'&&a.categoria!=='outros'?'outros':(a.categoria||'outros')):'outros',desc:String(a.descricao||'').slice(0,60),data:dt,st:'real',fixa:false});
      markReg(db,today);out=ok('Registrado: '+(tp==='r'?'entrada':'gasto')+' de '+fmt(a.valor)+'.'+(tp==='d'&&dt===today?limiteTxt():''));break}
    case'consultar_limite_hoje':{
      var b=budget(db,today);
      out=b.semRenda?no('Informe sua renda do mês para eu calcular o limite.'):ok(b.sobraHoje>=0?'Você pode gastar '+fmt(b.sobraHoje)+' hoje (limite de '+fmt(b.limiteDia)+' por dia, restam '+b.diasRest+' dias'+(b.modo==='caixa'?' até você receber de novo, em '+b.proxRenda.slice(8,10)+'/'+b.proxRenda.slice(5,7):'')+').':'Você passou '+fmt(-b.sobraHoje)+' do limite de hoje ('+fmt(b.limiteDia)+').',{limiteDia:b.limiteDia,sobraHoje:b.sobraHoje});break}
    case'posso_comprar':{
      var p=posso(db,today,a.valor);
      if(!p)return no('Informe sua renda do mês para eu calcular.');
      out=ok(p.nivel==='nao'?'Não cabe neste mês: passa '+fmt(p.excede)+'.':(p.nivel==='aperta'?'Cabe, mas aperta: seu limite por dia cai de '+fmt(p.limiteAtual)+' para '+fmt(p.novoLimite)+'.':'Cabe tranquilo: seu limite por dia vai de '+fmt(p.limiteAtual)+' para '+fmt(p.novoLimite)+'.'),p);break}
    case'criar_plano':{
      if(!a.nome||!Number.isInteger(a.alvo)||a.alvo<=0)return no('Informe o nome e o valor do plano.');
      var pr=/^\d{4}-\d{2}$/.test(a.prazo||'')?a.prazo:null,mn=Number.isInteger(a.mensal)&&a.mensal>=0?a.mensal:0;
      db.metas.push({id:uid(),nome:String(a.nome).slice(0,40),alvo:a.alvo,guardado:0,prazo:pr,mensal:mn,feita:false,tipo:TIPOS_PLANO.some(function(t){return t[0]===a.tipo})?a.tipo:tipoDe(a.nome)});
      markReg(db,today);out=ok('Plano "'+a.nome+'" criado.'+(mn?' Guardando '+fmt(mn)+' por mês'+(pr?' você chega no prazo.':'.'):''));break}
    case'guardar_no_plano':{
      var m=db.metas.filter(function(x){return x.id===a.plano})[0];
      if(!m)return no('Plano não encontrado.');if(!Number.isInteger(a.valor)||a.valor<=0)return no('Valor inválido.');
      var feito=guardarNoPlano(db,m,a.valor,today);
      out=ok(feito?'🎉 Plano "'+m.nome+'" alcançado! Parabéns.':'Guardado: '+fmt(a.valor)+' no plano "'+m.nome+'". Falta '+fmt(Math.max(0,m.alvo-m.guardado))+'.');break}
    case'status_plano':{
      var pl=db.metas.filter(function(x){return x.id===a.plano})[0];if(!pl)return no('Plano não encontrado.');
      var r=rota(pl,today),txt;
      if(r.status==='concluido')txt='O plano "'+pl.nome+'" já foi alcançado.';
      else{
        txt='Plano "'+pl.nome+'": '+r.pct+'% guardado, falta '+fmt(r.falta)+'.';
        if(r.status==='no-ritmo')txt+=' No ritmo atual você chega em '+r.chegaEm.slice(5,7)+'/'+r.chegaEm.slice(0,4)+(r.folgaMeses>0?', '+r.folgaMeses+(r.folgaMeses===1?' mês':' meses')+' antes do prazo.':', dentro do prazo.');
        else if(r.status==='atrasado')txt+=' Para chegar no prazo precisa guardar '+fmt(r.necessario)+' por mês e hoje está em '+fmt(pl.mensal)+'.';
        else if(r.status==='vencido')txt+=' O prazo já passou.';
        else if(r.status==='sem-prazo')txt+=' Guardando '+fmt(pl.mensal)+' por mês, chega em '+r.chegaEm.slice(5,7)+'/'+r.chegaEm.slice(0,4)+'.';
        else txt+=' Defina quanto vai guardar por mês'+(pl.prazo?' (para o prazo, precisa de '+fmt(r.necessario)+').':'.');
      }
      out=ok(txt,r);break}
    case'comparar_cenarios':{
      var pc=db.metas.filter(function(x){return x.id===a.plano})[0];if(!pc)return no('Plano não encontrado.');
      var c=cenarios(pc,db.prem,today);if(c.erro)return no(c.erro);
      out=ok(c.itens.map(function(i){return i.nome+': '+quandoTxt(i.min,i.max,today)}).join('. ')+'. '+c.aviso,c);break}
    case'resumo_mes':out=ok(resumoMesTxt(db,today));break;
    case'dicas_atlas':{
      var sd=saude(db,today),dc=dicas(db,today);
      out=ok((sd.score==null?'Ainda não dá para calcular sua saúde financeira: '+sd.label.toLowerCase()+'.':'Sua saúde financeira está em '+sd.score+' de 100 ('+sd.label.toLowerCase()+').')+(dc.length?' '+dc.slice(0,3).map(function(d){return d.texto}).join(' '):' Sem alertas agora.')+' São dicas educativas, não recomendação de investimento.',{saude:sd,dicas:dc});break}
    case'listar_contas':{
      var cc=contas(db,today),ab=cc.atrasadas.concat(cc.semana,cc.depois);
      out=ab.length?ok(ab.length+(ab.length===1?' conta a pagar: ':' contas a pagar: ')+ab.slice(0,6).map(function(r){return r.desc+' '+fmt(r.v)+' ('+r.data.slice(8,10)+'/'+r.data.slice(5,7)+')'}).join('; ')+'.',ab):ok('Nenhuma conta a pagar neste mês.');break}
    case'pagar_conta':{
      var rc=db.recs.filter(function(x){return x.id===a.id})[0]||null;
      if(!rc||!rc.fixa||rc.st!=='prev')return no('Não encontrei essa conta em aberto.');
      rc.st='real';markReg(db,today);out=ok('Conta "'+rc.desc+'" marcada como paga.');break}
    default:return no('Ação desconhecida.');
  }
  if(out.ok&&isMuta(nome)||origem==='assistente'){
    db.log=db.log||[];db.log.push({ts:new Date().toISOString(),origem:origem||'usuario',ferramenta:nome,ok:out.ok});if(db.log.length>200)db.log.splice(0,db.log.length-200);
  }
  return out;
}

/* ===== Demonstrativos, saúde financeira e dicas (v3) ===== */
var CAT_COR={mercado:'#1FA971',comida:'#E8A317',transporte:'#3B82C4',casa:'#19376D',saude:'#D14343',lazer:'#1FA9A0',compras:'#C97B2B',educacao:'#6C8EAD',outros:'#9AA9BF',fixas:'#0B2447',planos:'#7BD3A8'};
var NECESSIDADES=['mercado','casa','saude','transporte','educacao'];
var TIPOS_PLANO=[['reserva','🛟','Reserva de emergência'],['compra','🛒','Compra'],['viagem','✈️','Viagem'],['outro','⭐','Outro']];
function tipoIcone(t){for(var i=0;i<TIPOS_PLANO.length;i++)if(TIPOS_PLANO[i][0]===t)return TIPOS_PLANO[i][1];return'⭐'}

function mesResumo(db,ym){
  var r={renda:0,fixas:0,variavel:0,porCat:{},saidas:0,aportes:0};
  db.recs.forEach(function(x){
    if(monthOf(x.data)!==ym)return;
    if(x.t==='r'){r.renda+=x.v;return}
    r.saidas+=x.v;
    if(x.fixa)r.fixas+=x.v;else{r.variavel+=x.v;r.porCat[x.cat]=(r.porCat[x.cat]||0)+x.v}
  });
  (db.aportes||[]).forEach(function(a){if(monthOf(a.data)===ym)r.aportes+=a.v});
  r.sobra=r.renda-r.saidas;
  return r;
}
function serieMeses(db,today,n){
  var out=[],ym0=monthOf(today);
  for(var i=n-1;i>=0;i--){var ym=addMonths(ym0,-i),m=mesResumo(db,ym);out.push({ym:ym,entradas:m.renda,saidas:m.saidas})}
  return out;
}
function mediaVariavel(db,today,n){
  var ym0=monthOf(today),tot=0,cnt=0;
  for(var i=1;i<=n;i++){var m=mesResumo(db,addMonths(ym0,-i));if(m.variavel>0){tot+=m.variavel;cnt++}}
  return cnt?Math.round(tot/cnt):null;
}

function projecao(db,today,n){
  var ym0=monthOf(today),tpl=db.recs.filter(function(r){return r.rec==='m'&&!r.from});
  var rendaRec=sum(tpl.filter(function(t){return t.t==='r'})),fixRec=sum(tpl.filter(function(t){return t.t==='d'&&t.fixa}));
  var media=mediaVariavel(db,today,3),out=[],temRenda=rendaRec>0;
  var ativos=db.metas.filter(function(m){return!m.feita&&m.mensal>0}).map(function(m){return{m:m,fim:rota(m,today).mesesParaChegar}});
  for(var i=1;i<=n;i++){
    var ym=addMonths(ym0,i);
    var umas=db.recs.filter(function(r){return monthOf(r.data)===ym&&!r.rec});
    var renda=rendaRec+sum(umas.filter(function(r){return r.t==='r'}));
    var fixas=fixRec+sum(umas.filter(function(r){return r.t==='d'&&r.fixa}));
    var reserva=ativos.reduce(function(s,a){return s+(i<=a.fim?a.m.mensal:0)},0);
    var sobra=renda-fixas-reserva;
    out.push({ym:ym,renda:renda,fixas:fixas,reserva:reserva,variavelEst:media,sobra:sobra,sobraEst:sobra-(media||0),negativo:sobra-(media||0)<0});
  }
  return{meses:out,semRenda:!temRenda,semMedia:media==null};
}

function saude(db,today){
  var ym=monthOf(today),b=budgetMes(db,today),mr=mesResumo(db,ym),c=contas(db,today),fat=[];
  if(mr.renda>0){
    var poup=Math.max(mr.aportes,b.reserva),pct=poup*100/mr.renda;
    fat.push({id:'poupanca',nome:'Quanto você guarda',pts:Math.min(25,Math.round(pct/20*25)),detalhe:Math.round(pct)+'% da renda (referência comum: 20%)'});
    var folga=b.restante,pts2=folga>=0?25:Math.max(0,Math.round(25*(1-Math.min(1,-folga*10/mr.renda))));
    fat.push({id:'orcamento',nome:'Gastos dentro da renda',pts:pts2,detalhe:folga>=0?'Sobram '+fmt(folga)+' no mês':'Passou '+fmt(-folga)+' do que sobrava'});
  }
  var atr=c.atrasadas.length;
  fat.push({id:'contas',nome:'Contas em dia',pts:Math.max(0,25-8*atr),detalhe:atr?atr+(atr===1?' conta atrasada':' contas atrasadas'):'Nenhuma conta atrasada'});
  var media=mediaVariavel(db,today,3),custo=mr.fixas+(media!=null?media:mr.variavel);
  if(custo>0){
    var res=sum(db.metas.filter(function(m){return m.tipo==='reserva'}).map(function(m){return{v:m.guardado}})),meses=res/custo;
    fat.push({id:'reserva',nome:'Reserva de emergência',pts:Math.min(25,Math.round(meses/6*25)),detalhe:meses.toFixed(1).replace('.',',')+' meses de gastos cobertos (referência comum: 3 a 6)'});
  }
  if(fat.length<3)return{score:null,label:'Informe sua renda para ver',fatores:fat};
  var score=Math.round(fat.reduce(function(s,f){return s+f.pts},0)*100/(25*fat.length));
  return{score:score,label:score>=70?'Saudável':score>=40?'Em construção':'Pede atenção',fatores:fat};
}

function regra503020(db,ym){
  var mr=mesResumo(db,ym),needs=mr.fixas,wants=0;
  for(var k in mr.porCat){if(NECESSIDADES.indexOf(k)>=0)needs+=mr.porCat[k];else wants+=mr.porCat[k]}
  var out={renda:mr.renda,needs:needs,wants:wants,save:mr.aportes};
  if(mr.renda>0){out.pNeeds=Math.round(needs*100/mr.renda);out.pWants=Math.round(wants*100/mr.renda);out.pSave=Math.round(mr.aportes*100/mr.renda)}
  return out;
}

function comparaMes(db,ym){
  var a=mesResumo(db,ym).porCat,b=mesResumo(db,addMonths(ym,-1)).porCat,keys={},out=[];
  for(var k in a)keys[k]=1;for(var k2 in b)keys[k2]=1;
  for(var c in keys){var cur=a[c]||0,prev=b[c]||0;out.push({cat:c,cur:cur,prev:prev,delta:cur-prev,pct:prev>0?Math.round((cur-prev)*100/prev):null})}
  out.sort(function(x,y){return Math.abs(y.delta)-Math.abs(x.delta)});
  return out;
}

function eSe(p,today,extra){
  var r0=rota(p,today);
  if(!(p.mensal>0)||r0.falta===0)return null;
  var n=Math.ceil(r0.falta/(p.mensal+extra));
  return{extra:extra,meses:n,antes:r0.mesesParaChegar-n,chegaEm:addMonths(monthOf(today),n)};
}

function serieEvolucao(p,today){
  var r=rota(p,today),ym0=monthOf(today),nPrazo=p.prazo?Math.max(0,monthsBetween(ym0,p.prazo)):0;
  var N=Math.min(36,Math.max(r.mesesParaChegar||0,nPrazo,1)+1),meses=[],atual=[],nec=[];
  for(var k=0;k<=N;k++){
    meses.push(addMonths(ym0,k));
    atual.push(p.mensal>0?Math.min(p.alvo,p.guardado+p.mensal*k):p.guardado);
    nec.push(r.necessario&&k<=nPrazo?Math.min(p.alvo,p.guardado+r.necessario*k):null);
  }
  return{meses:meses,atual:atual,necessaria:nec};
}
function marcos(p){return[25,50,75,100].map(function(m){return{pct:m,ok:p.guardado*100>=p.alvo*m}})}

function dicas(db,today){
  var ym=monthOf(today),mr=mesResumo(db,ym),b=budget(db,today),c=contas(db,today),out=[];
  function add(n,t){out.push({nivel:n,texto:t})}
  if(c.atrasadas.length)add('warn',c.atrasadas.length+(c.atrasadas.length===1?' conta está atrasada':' contas estão atrasadas')+' ('+fmt(sum(c.atrasadas))+'). Pagar logo evita multa e juros.');
  if(mr.renda>0){
    var pf=Math.round(mr.fixas*100/mr.renda);
    if(pf>50)add('warn','Suas contas fixas somam '+pf+'% da renda. Acima de 50% sobra pouco espaço para guardar e para imprevistos.');
  }
  var cmp=comparaMes(db,ym).filter(function(x){return x.pct!=null&&x.delta>=5000&&x.pct>=30});
  if(cmp.length)add('warn','Você gastou '+cmp[0].pct+'% a mais em '+catLabel(cmp[0].cat)+' que no mês passado ('+fmt(cmp[0].delta)+' a mais).');
  db.metas.filter(function(m){return!m.feita}).forEach(function(m){
    var r=rota(m,today);
    if(r.status==='atrasado'){
      var gap=r.necessario-m.mensal,maior=null,mv=0;
      var pm=mesResumo(db,addMonths(ym,-1)).porCat;for(var k in pm)if(pm[k]>mv){mv=pm[k];maior=k}
      add('info','Plano "'+m.nome+'": faltam '+fmt(gap)+' por mês para chegar no prazo.'+(maior&&mv>=gap?' Para comparar: no mês passado você gastou '+fmt(mv)+' em '+catLabel(maior)+'.':''));
    }else if(r.status==='no-ritmo'&&r.folgaMeses>=2)add('ok','Plano "'+m.nome+'" no ritmo: chega '+r.folgaMeses+' meses antes do prazo.');
    else if(r.status==='sem-aporte')add('info','Defina quanto vai guardar por mês no plano "'+m.nome+'"'+(r.necessario?' (para o prazo, precisa de '+fmt(r.necessario)+').':'.'));
  });
  var s=saude(db,today),fr=s.fatores.filter(function(f){return f.id==='reserva'})[0];
  if(fr&&fr.pts<12&&!db.metas.some(function(m){return m.tipo==='reserva'}))add('info','Você ainda não tem um plano de reserva de emergência. Uma referência comum é cobrir de 3 a 6 meses de gastos.');
  else if(fr&&fr.pts<12)add('info','Sua reserva de emergência cobre pouco do seu custo mensal. '+fr.detalhe+'.');
  var sd=streak(db,today);if(sd>=7)add('ok','Você está há '+sd+' dias seguidos registrando. Isso é o que mais ajuda a controlar o dinheiro.');
  var ult=Object.keys(db.reg).sort().pop();
  if(ult&&ult<addDays(today,-2))add('info','Faz alguns dias sem registrar nada. Um minuto por dia mantém o limite diário confiável.');
  var ordem={warn:0,info:1,ok:2};out.sort(function(a,b2){return ordem[a.nivel]-ordem[b2.nivel]});
  return out.slice(0,5);
}

function guardarNoPlano(db,m,v,today){
  m.guardado+=v;db.aportes=db.aportes||[];db.aportes.push({id:uid(),plano:m.id,v:v,data:today,ts:Date.now()});
  var feito=!m.feita&&m.guardado>=m.alvo;if(feito)m.feita=true;markReg(db,today);return feito;
}

function resumoMesTxt(db,today){
  var ym=monthOf(today),mr=mesResumo(db,ym),nome=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][+ym.slice(5)-1];
  if(mr.renda===0&&mr.saidas===0)return'Ainda não há lançamentos em '+nome+'.';
  var top=null,tv=0;for(var k in mr.porCat)if(mr.porCat[k]>tv){tv=mr.porCat[k];top=k}
  return'Em '+nome+': entradas de '+fmt(mr.renda)+', saídas de '+fmt(mr.saidas)+' (contas fixas '+fmt(mr.fixas)+', outros gastos '+fmt(mr.variavel)+'), '+(mr.sobra>=0?'sobram '+fmt(mr.sobra):'faltam '+fmt(-mr.sobra))+'.'+(top?' A categoria que mais pesou foi '+catLabel(top)+' ('+fmt(tv)+').':'');
}

function bkPrecisa(db,today){
  if(!db.bk||!(db.recs.length||db.metas.length))return false;
  if(db.bkAdiar&&today<db.bkAdiar)return false;
  return Math.round((parseD(today)-parseD(db.bk))/864e5)>=14;
}
function tipoDe(n){
  var t=norm(n||'');
  if(/reserva|emergencia|imprevisto/.test(t))return'reserva';
  if(/viagem|viajar|ferias|passeio|cruzeiro/.test(t))return'viagem';
  if(/moto|carro|casa|apartamento|celular|notebook|computador|bicicleta|bike|tv|geladeira|reforma|comprar|compra|entrada/.test(t))return'compra';
  return'outro';
}

function sEdit(id){
  var r=db.recs.filter(function(x){return x.id===id})[0];if(!r)return;
  qf={t:r.t,cat:r.cat,data:r.data,id:id};
  openSheet('<h2>Editar <button class="icon-btn" data-act="close" aria-label="Fechar">×</button></h2>'+
    '<label>Valor</label><input class="money" id="ev" inputmode="numeric" value="'+fmt(r.v)+'">'+
    (r.t==='d'&&!r.fixa?'<div id="qcats"><label>Categoria</label><div class="chips">'+catChips(r.cat)+'</div></div>':'')+
    '<label>Descrição</label><input id="ed" maxlength="60" value="'+esc(r.desc)+'">'+
    '<label>Data</label><input type="date" id="edt" value="'+esc(r.data)+'">'+
    ((r.fixa&&!r.est)||r.t==='r'?'<label>Situação</label><div class="seg"><button type="button" class="chip '+(r.st==='prev'?'on':'')+'" data-act="est" data-s="prev">'+(r.t==='r'?'Prevista':'A pagar')+'</button><button type="button" class="chip '+(r.st==='real'?'on':'')+'" data-act="est" data-s="real">'+(r.t==='r'?'Recebida':'Paga')+'</button></div>':'')+
    '<div class="row"><button class="btn pri" data-act="saveedit">Salvar</button><button class="btn danger" data-act="delrec">Excluir</button></div>');
  qf.st=r.st;
}
function saveEdit(){
  var r=db.recs.filter(function(x){return x.id===qf.id})[0];if(!r)return closeSheet();
  var v=toCents($('#ev').value);if(!v){toast('Digite o valor.');return}
  r.v=v;r.desc=$('#ed').value.trim().slice(0,60);var d=$('#edt').value;if(/^\d{4}-\d{2}-\d{2}$/.test(d))r.data=d;
  if(r.t==='d'&&!r.fixa)r.cat=qf.cat;if((r.fixa&&!r.est)||r.t==='r')r.st=qf.st;
  save();closeSheet();render();toast('Alteração salva.');
}

  var today=todayStr();
  openSheet('<h2>Nova conta <button class="icon-btn" data-act="close" aria-label="Fechar">×</button></h2>'+
    '<label>Nome</label><input id="cn" maxlength="60" placeholder="Ex.: Aluguel" autofocus>'+
    '<label>Valor</label><input class="money" id="cv" inputmode="numeric" placeholder="R$ 0,00">'+
    '<label>Vence em</label><input type="date" id="cd" value="'+today+'">'+
    '<label style="display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink)"><input type="checkbox" id="cr" checked style="width:auto"> Repetir todo mês</label>'+
    '<div class="row"><button class="btn pri" data-act="saveconta">Salvar conta</button></div>');
}
function saveConta(){
  var v=toCents($('#cv').value),n=$('#cn').value.trim(),d=$('#cd').value;
  if(!n){toast('Dê um nome para a conta.');return}if(!v){toast('Digite o valor.');return}if(!/^\d{4}-\d{2}-\d{2}$/.test(d))d=todayStr();
  db.recs.push({id:uid(),t:'d',v:v,cat:'casa',desc:n.slice(0,60),data:d,st:'prev',fixa:true,rec:$('#cr').checked?'m':null});
  save();closeSheet();render();toast('Conta cadastrada. O limite diário já considera ela.');
}
function sMeta(id){
  var m=id?db.metas.filter(function(x){return x.id===id})[0]:null;qf={id:id||null,tipo:m?m.tipo:null};
  openSheet('<h2>'+(m?'Editar plano':'Novo plano')+' <button class="icon-btn" data-act="close" aria-label="Fechar">×</button></h2>'+
    '<label>Tipo de plano</label><div class="chips" id="ptipos">'+TIPOS_PLANO.map(function(t){return'<button type="button" class="chip '+(qf.tipo===t[0]?'on':'')+'" data-act="ptipo" data-k="'+t[0]+'">'+t[1]+' '+esc(t[2])+'</button>'}).join('')+'</div>'+
    '<label>Nome</label><input id="mn" maxlength="40" placeholder="Ex.: Viagem de fim de ano" value="'+esc(m?m.nome:'')+'" autofocus>'+
    '<label>Quanto precisa juntar?</label><input class="money" id="ma" inputmode="numeric" placeholder="R$ 0,00" value="'+(m?fmt(m.alvo):'')+'">'+
    '<label>Até quando? (opcional)</label><input type="month" id="mp" value="'+esc(m&&m.prazo?m.prazo:'')+'">'+
    '<label>Quanto vai guardar por mês neste plano? (deixe vazio para não reservar)</label><input class="money" id="mm" style="font-size:22px" inputmode="numeric" placeholder="R$ 0,00" value="'+(m&&m.mensal?fmt(m.mensal):'')+'">'+
    '<div id="msug" class="muted" style="margin-top:6px"></div>'+
    '<div class="row"><button class="btn pri" data-act="savemeta">Salvar plano</button>'+(m?'<button class="btn danger" data-act="delmeta">Excluir</button>':'')+'</div>');

function mSug(){
  var a=toCents($('#ma').value),p=$('#mp').value,el=$('#msug');if(!el)return;
  var cur=qf.id?db.metas.filter(function(x){return x.id===qf.id})[0]:null;
  var s=a&&p?sugestaoMensal({alvo:a,guardado:cur?cur.guardado:0,prazo:p},monthOf(todayStr())):null;
  el.innerHTML=s?'Para chegar no prazo: <b>'+fmt(s)+'</b> por mês. <button type="button" class="chip" data-act="usasug" data-v="'+s+'">Usar este valor</button>':'';
}
function saveMeta(){
  var n=$('#mn').value.trim(),a=toCents($('#ma').value);
  if(!n){toast('Dê um nome para o plano.');return}if(!a){toast('Digite quanto precisa juntar.');return}
  var p=$('#mp').value||null,mm=toCents($('#mm').value);
  if(qf.id){var m=db.metas.filter(function(x){return x.id===qf.id})[0];m.nome=n.slice(0,40);m.tipo=qf.tipo||tipoDe(n);m.alvo=a;m.prazo=p;m.mensal=mm;m.feita=m.guardado>=m.alvo}
  else db.metas.push({id:uid(),nome:n.slice(0,40),alvo:a,guardado:0,prazo:p,mensal:mm,feita:false,tipo:qf.tipo||tipoDe(n)});
  save();closeSheet();render();toast('Plano salvo.');
}
function sGuardei(id){
  var m=db.metas.filter(function(x){return x.id===id})[0];if(!m)return;qf={id:id};
  openSheet('<h2>Guardei para: '+esc(m.nome)+' <button class="icon-btn" data-act="close" aria-label="Fechar">×</button></h2><label>Quanto você guardou agora?</label><input class="money" id="gv" inputmode="numeric" placeholder="R$ 0,00"><div class="row"><button class="btn pri" data-act="saveguardei">Confirmar</button></div>');

/* ---------- comparar caminhos (educativo) ---------- */
var PREM_ROTULOS=[['poupMes','Poupança: rendimento por mês (%)'],['cdi','Juros da renda fixa (CDI, % ao ano)'],['pctCdi','Quanto do CDI o produto paga (%)'],['consAdm','Consórcio: taxa de administração total (%)'],['consFundo','Consórcio: fundo de reserva (%)'],['consN','Consórcio: prazo do grupo (meses)'],['contMin','Consórcio: contemplação mais cedo (mês)'],['finJuros','Financiamento: juros (% ao mês)'],['finN','Financiamento: prazo (meses)']];
function sCen(id){
  var m=db.metas.filter(function(x){return x.id===id})[0];if(!m)return;qf={id:id};
  openSheet('<h2>Comparar caminhos <button class="icon-btn" data-act="close" aria-label="Fechar">×</button></h2>'+
    '<p class="muted" style="margin:0">Plano "'+esc(m.nome)+'": '+fmt(m.guardado)+' de '+fmt(m.alvo)+'. Veja caminhos diferentes para chegar lá. Não indicamos qual escolher.</p>'+
    '<div class="alert warn">'+esc(DISCLAIMER)+'</div>'+
    '<details style="margin-top:10px"><summary style="font-weight:700;cursor:pointer">Premissas (edite com as taxas reais)</summary>'+
    PREM_ROTULOS.map(function(x){return'<label>'+esc(x[1])+'</label><input data-prem="'+x[0]+'" inputmode="decimal" value="'+String(db.prem[x[0]]).replace('.',',')+'">'}).join('')+'</details>'+
    '<div id="cres"></div>');
  renderCen();
}
function readPrem(){
  document.querySelectorAll('input[data-prem]').forEach(function(i){
    var k=i.getAttribute('data-prem'),v=parseFloat(String(i.value).replace(',','.'));
    if(!isFinite(v)||v<0)return;
    var lim={consN:[12,360],contMin:[1,360],finN:[1,360],pctCdi:[0,300],cdi:[0,100],consAdm:[0,100],consFundo:[0,100],finJuros:[0,30]}[k]||[0,1000];
    db.prem[k]=Math.min(lim[1],Math.max(lim[0],v));
  });
  save();
}
function custoTxt(i){
  if(i.id==='guardar')return'Sai do seu bolso: '+fmt(i.sai)+'.';
  if(i.id==='poupanca')return'Você deposita '+fmt(i.sai)+' e o rendimento estimado é de '+fmt(i.ganho)+', sem imposto.';
  if(i.id==='renda-fixa')return'Você deposita '+fmt(i.sai)+' e o rendimento líquido estimado é de '+fmt(i.ganho)+'.';
  if(i.id==='consorcio')return'Parcela de '+fmt(i.parcela)+' por mês; total de '+fmt(i.sai)+', ou seja, '+fmt(i.extra)+' a mais que o valor do bem (taxas).';
  return'Parcela de '+fmt(i.parcela)+' por mês; total de '+fmt(i.sai)+', ou seja, '+fmt(i.extra)+' a mais que o valor do bem (juros).';
}
function renderCen(){
  var m=db.metas.filter(function(x){return x.id===qf.id})[0],el=$('#cres');if(!m||!el)return;
  var today=todayStr(),c=cenarios(m,db.prem,today);
  if(c.erro){el.innerHTML='<div class="alert warn">'+esc(c.erro)+'</div>';return}
  el.innerHTML='<p class="muted">Aporte considerado: '+fmt(c.aporteUsado)+' por mês.</p>'+c.itens.map(function(i){
    return'<div class="card"><h3>'+esc(i.nome)+'</h3><div class="kpis"><div><small>Tem o bem</small><b style="font-size:15px">'+esc(quandoTxt(i.min,i.max,today))+'</b></div><div><small>Incerteza no prazo</small><b style="font-size:15px">'+esc(i.incerteza)+'</b></div></div>'+
      '<p style="margin:10px 0 4px">'+esc(custoTxt(i))+'</p>'+
      '<div class="muted">✔ '+i.pros.map(esc).join('<br>✔ ')+'</div><div class="muted" style="margin-top:4px">✖ '+i.contras.map(esc).join('<br>✖ ')+'</div>'+
      (i.alertas&&i.alertas.length?i.alertas.map(function(x){return'<div class="alert warn">'+esc(x)+'</div>'}).join(''):'')+'</div>';
  }).join('')+'<p class="muted" style="font-size:12px">'+esc(DISCLAIMER)+'</p>';
}

/* ---------- Falar com o Atlas (voz e texto) ---------- */
var pend=null;
function falar(t){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';speechSynthesis.speak(u)}catch(e){}}
function sAtlas(){
  pend=null;var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  openSheet('<h2>Falar com o Atlas <button class="icon-btn" data-act="close" aria-label="Fechar">×</button></h2><p class="muted" style="margin:0">Fale ou digite o que quer fazer.</p>'+
    '<div class="qt" style="margin-top:8px"><input id="ac" placeholder="Ex.: quanto posso gastar hoje" autocomplete="off" autofocus>'+(SR?'<button class="icon-btn" data-act="avoz" aria-label="Falar">🎤</button>':'')+'<button class="icon-btn" data-act="aenviar" aria-label="Enviar">➤</button></div>'+
    '<div class="chips">'+['quanto posso gastar hoje','gastei 50 no mercado','posso comprar 900','criar plano moto 20 mil em 18 meses','como está o plano da moto'].map(function(x){return'<button type="button" class="chip" data-act="aex" data-t="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div><div id="ares"></div>');
}
function aShow(x,falado,r){
  var el=$('#ares');if(!el)return;
  el.innerHTML='<div class="card"><div class="'+(x.ok?'':'muted')+'">'+esc(x.mensagem)+'</div>'+(x.ok&&r&&r.ferramenta==='comparar_cenarios'?'<div class="row"><button class="btn sm dark" data-act="cen" data-id="'+esc(r.args.plano)+'">Ver os caminhos</button></div>':'')+'</div>';
  if(falado)falar(x.fala);
}
function aEnviar(falado){
  var el=$('#ares'),txt=$('#ac').value,r=interpretar(db,todayStr(),txt);
  if(r.erro){el.innerHTML='<div class="alert warn">'+esc(r.erro)+'</div>';return}
  if(!r.muta){aShow(executar(db,todayStr(),r.ferramenta,r.args,'assistente'),falado,r);return}
  pend=r;pend.falado=!!falado;
  el.innerHTML='<div class="card"><b>'+esc(r.resumo)+'</b><div class="row"><button class="btn pri" data-act="aconf">Confirmar</button><button class="btn" data-act="acanc">Cancelar</button></div></div>';
}
function aVoz(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  var r=new SR();r.lang='pt-BR';r.onresult=function(ev){$('#ac').value=ev.results[0][0].transcript;aEnviar(true)};
  r.onerror=function(){toast('Microfone indisponível. Digite o comando.')};try{r.start();toast('Pode falar…')}catch(x){}
}

/* ---------- eventos ---------- */
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains('money')){var c=toCents(t.value);t.value=c?fmt(c):'';if(t.id==='pv')pRes();if(t.id==='ma')mSug()}
  if(t.id==='bx'){buscaExt=t.value;var xl=$('#xl');if(xl)xl.innerHTML=extratoLista(mesSel,todayStr())}
  if(t.id==='qt')onQuick(t.value);
  if(t.id==='qd')t.dataset.auto='0';
  if(t.id==='mp')mSug();
  if(t.dataset&&t.dataset.prem){readPrem();renderCen()}
  if(t.id==='qdt'&&qf){qf.data=t.value;syncQF()}
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='sheet')closeSheet();return}
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id'),today=todayStr();
  switch(a){
    case'nav':view=el.getAttribute('data-v');if(view==='painel'||view==='extrato')mesSel=mesSel||monthOf(today);render();window.scrollTo(0,0);break;
    case'add':sAdd();break;case'close':closeSheet();break;case'posso':sPosso();break;case'gear':sGear();break;
    case'setup':sSetup();break;
    case'skipsetup':db.onb=true;save();closeSheet();break;
    case'savesetup':
      var r=toCents($('#sr').value);if(!r){toast('Digite quanto você recebe por mês.');break}
      db.recs=db.recs.filter(function(x){return!(x.rec==='m'&&!x.from&&(x.desc==='Renda do mês'||x.est)&&monthOf(x.data)===monthOf(today))});
      setup(db,today,r,parseInt($('#sd').value,10),toCents($('#sf').value),$('#sdu').checked?{n:parseInt($('#sd').value,10)||5,sab:$('#sds').checked}:null);var sv0=toCents($('#ss').value);if(sv0>0)definirSaldo(db,sv0,Date.now());markReg(db,today);save();closeSheet();render();toast('Pronto! Veja quanto você pode gastar hoje.');break;
    case'saldo':sSaldo();break;
    case'novorec':sRecebimento();break;
    case'rquando':{var u=el.getAttribute('data-k')==='util';$('#rqd').classList.toggle('on',!u);$('#rqu').classList.toggle('on',u);$('#rbd').hidden=u;$('#rbu').hidden=!u;break}
    case'saverec':{var rv=toCents($('#rv').value),rn=$('#rn').value.trim(),rd=$('#rd').value,util=!$('#rbu').hidden;if(!rn){toast('Dê um nome para o recebimento.');break}if(!rv){toast('Digite o valor.');break}
      var nova={id:uid(),t:'r',v:rv,cat:'outros',desc:rn.slice(0,60),st:'prev',fixa:false,rec:$('#rr').checked?'m':null};
      if(util){var nn=parseInt($('#rn5').value,10);if(!(nn>=1&&nn<=23)){toast('Digite um dia útil de 1 a 23.');break}nova.regra={n:nn,sab:$('#rsab').checked};nova.data=nEsimoDiaUtil(monthOf(today),nn,nova.regra.sab);nova.rec='m'}
      else{if(!/^\d{4}-\d{2}-\d{2}$/.test(rd)){toast('Escolha a data prevista.');break}nova.data=rd}
      db.recs.push(nova);save();closeSheet();render();toast('Recebimento cadastrado: cai em '+nova.data.slice(8,10)+'/'+nova.data.slice(5,7)+'.');break}
    case'savesaldo':{var sv=toCents($('#sv').value);if(!sv){toast('Digite o saldo, ou toque em "Meu saldo é zero".');break}definirSaldo(db,sv,Date.now());save();closeSheet();render();toast('Saldo atualizado.');break}
    case'saldozero':definirSaldo(db,0,Date.now());save();closeSheet();render();toast('Saldo zerado. Os próximos registros ajustam o valor.');break;
    case'rendaok':{var rr=db.recs.filter(function(x){return x.id===id})[0];if(!rr)break;rr.st='real';markReg(db,today);save();render();toast('Renda no saldo.','Desfazer',function(){rr.st='prev';save();render()});break}
    case'tipo':qf.t=el.getAttribute('data-t');syncQF();break;
    case'cat':qf.cat=el.getAttribute('data-k');if($('#qv')||$('#ev'))syncQFcats();break;
    case'dia':qf.data=addDays(today,+el.getAttribute('data-d'));syncQF();break;
    case'saveadd':saveAdd();break;
    case'voz':voz();break;
    case'nada':markReg(db,today);save();render();toast('Anotado. Dia em dia!');break;
    case'pagar':{var rc=db.recs.filter(function(x){return x.id===id})[0];if(!rc)break;if(rc.st==='prev'&&rc.fixa){rc.st='real';markReg(db,today);save();render();toast('Conta marcada como paga.','Desfazer',function(){rc.st='prev';save();render()})}else sEdit(id);break}
    case'edit':sEdit(id);break;
    case'est':qf.st=el.getAttribute('data-s');el.parentNode.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',c===el)});break;
    case'saveedit':saveEdit();break;
    case'delrec':{var i=db.recs.map(function(x){return x.id}).indexOf(qf.id);if(i<0)break;var gone=db.recs.splice(i,1)[0];save();closeSheet();render();toast('Excluído.','Desfazer',function(){db.recs.push(gone);save();render()});break}
    case'mes':mesSel=addMonths(mesSel,+el.getAttribute('data-n'));render();break;
    case'novaconta':sConta();break;case'saveconta':saveConta();break;
    case'novameta':sMeta();break;case'editmeta':sMeta(id);break;case'savemeta':saveMeta();break;
    case'usasug':$('#mm').value=fmt(+el.getAttribute('data-v'));break;
    case'delmeta':{var mi=db.metas.map(function(x){return x.id}).indexOf(qf.id);if(mi<0)break;var mg=db.metas.splice(mi,1)[0];save();closeSheet();render();toast('Plano excluído.','Desfazer',function(){db.metas.push(mg);save();render()});break}
    case'guardei':sGuardei(id);break;
    case'saveguardei':{var g=toCents($('#gv').value),mt=db.metas.filter(function(x){return x.id===qf.id})[0];if(!g||!mt){toast('Digite o valor.');break}
      var done=guardarNoPlano(db,mt,g,today);save();closeSheet();render();toast(done?'🎉 Plano alcançado! Parabéns.':'Guardado. Falta '+fmt(Math.max(0,mt.alvo-mt.guardado))+'.');break}
    case'cen':sCen(id);break;case'det':sDet(id);break;case'csv':dlCsv();break;case'bkdepois':db.bkAdiar=addDays(today,3);save();render();toast('Certo, aviso de novo em 3 dias.');break;
    case'ptipo':qf.tipo=el.getAttribute('data-k');document.querySelectorAll('#ptipos .chip').forEach(function(c){c.classList.toggle('on',c===el)});break;
    case'atlas':sAtlas();break;case'avoz':aVoz();break;case'aenviar':aEnviar(false);break;
    case'aex':$('#ac').value=el.getAttribute('data-t');aEnviar(false);break;
    case'acanc':pend=null;$('#ares').innerHTML='';break;
    case'aconf':{if(!pend)break;var pr=pend;pend=null;var x=executar(db,today,pr.ferramenta,pr.args,'assistente');save();render();aShow(x,pr.falado,pr);break}
    case'copybk':copyBk();break;case'dlbk':dlBk();break;
    case'restore':{try{var v=sanitize(JSON.parse($('#bk').value));if(!v)throw 0;db=v;save();closeSheet();render();toast('Backup restaurado.')}catch(x){toast('Backup inválido. Confira se colou o texto inteiro.')}break}
    case'wipe':if(confirm('Apagar todos os dados deste aparelho? Isso não pode ser desfeito.')){db=emptyDb();save();closeSheet();render()}break;
    case'toastact':{var t=$('#toast');t.hidden=true;if(t._fn){t._fn();t._fn=null}break}
  }
});
function syncQFcats(){document.querySelectorAll('#qcats .chip').forEach(function(c){c.classList.toggle('on',c.getAttribute('data-k')===qf.cat)})}
function bkFeito(){db.bk=todayStr();db.bkAdiar=null;save();render()}
function copyBk(){var s=JSON.stringify(db);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){bkFeito();toast('Backup copiado. Cole num lugar seguro.')},function(){toast('Não consegui copiar. Use "Baixar arquivo".')})}else toast('Use "Baixar arquivo".')}
function dlBk(){var b=new Blob([JSON.stringify(db)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='atlas-financas-backup-'+todayStr()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);bkFeito()}
function voz(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  var r=new SR();r.lang='pt-BR';r.onresult=function(ev){var s=ev.results[0][0].transcript;$('#qt').value=s;onQuick(s)};
  r.onerror=function(){toast('Microfone indisponível. Digite o valor.')};try{r.start();toast('Pode falar…')}catch(x){}
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();if(e.key==='Enter'&&e.target.id==='qt'){e.preventDefault();saveAdd()}if(e.key==='Enter'&&e.target.id==='ac'){e.preventDefault();aEnviar(false)}});

/* Porta de entrada para o Atlas assistente (ver docs/ASSISTENTE-ACOES.md) */
window.AtlasFin={
  ferramentas:FERRAMENTAS,
  interpretar:function(texto){return interpretar(db,todayStr(),texto)},
  executar:function(nome,args,origem){var r=executar(db,todayStr(),nome,args,origem||'assistente');if(r.ok&&isMuta(nome)){save();render()}return r}
};
db=load();if(!db.bk){db.bk=todayStr();save()}render();
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js')}catch(e){}
if(!db.onb&&!db.recs.length)sSetup();
</script>
