name: Verificar publicação Atlas
on:
  push:
    branches: [main]
    paths: ['nuvem/**', 'tests/verificar_publicacao.py', '.github/workflows/verificar-publicacao.yml']
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
permissions:
  contents: read
jobs:
  conferir:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir arquivos efetivamente publicados
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python tests/verificar_publicacao.py
      - uses: actions/upload-artifact@v4
        with:
          name: verificacao-publicacao
          path: test-results/publicacao.json
