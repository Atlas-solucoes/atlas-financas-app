<script>
/* Rede de segurança: se algo quebrar ao abrir, mostra o motivo na tela (em vez de página em branco) e oferece limpar o cache do app. */
(function(){
  function limpar(){try{var p=[];if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}));if(window.caches)p.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}));Promise.all(p).then(function(){location.replace(location.pathname+'?r='+Date.now())},function(){location.reload()})}catch(e){location.reload()}}
  window.__limparCache=limpar;
  if(/[?&]limpar=1/.test(location.search))limpar();
  function mostra(m){try{if(document.body&&document.body.innerText.replace(/\s/g,'').length>40)return;var d=document.createElement('div');d.style.cssText='font:16px system-ui;padding:24px;max-width:480px;margin:0 auto;color:#16202E';d.innerHTML='<h2 style="margin:0 0 8px">Não consegui abrir o app</h2><p>Toque em "Limpar e abrir de novo". Se repetir, mande esta mensagem para o Daniel:</p><pre style="white-space:pre-wrap;background:#eef2f7;padding:10px;border-radius:8px;font-size:13px"></pre><button style="font:inherit;padding:14px 22px;border:0;border-radius:999px;background:#17458F;color:#fff">Limpar e abrir de novo</button>';d.querySelector('pre').textContent=String(m);d.querySelector('button').onclick=limpar;(document.body||document.documentElement).appendChild(d)}catch(e){}}
  window.addEventListener('error',function(e){setTimeout(function(){mostra((e.message||'erro')+' ('+(e.lineno||'?')+':'+(e.colno||'?')+')')},400)});
  window.addEventListener('unhandledrejection',function(e){setTimeout(function(){mostra('promessa: '+((e.reason&&e.reason.message)||e.reason))},400)});
})();
</script>

function pad(n){return(n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return ymd(new Date())}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)}
function monthOf(d){return d.slice(0,7)}
function daysInMonth(ym){var p=ym.split('-');return new Date(+p[0],+p[1],0).getDate()}
function addMonths(ym,n){var p=ym.split('-'),d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function monthsBetween(a,b){var x=a.split('-'),y=b.split('-');return(+y[0]-+x[0])*12+(+y[1]-+x[1])}
function fmt(c){if(c==null)return'—';var neg=c<0;c=Math.abs(c);return(neg?'-':'')+'R$ '+String(Math.floor(c/100)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+pad(c%100)}
function toCents(s){var d=String(s==null?'':s).replace(/\D/g,'').slice(0,11);return d?parseInt(d,10):0}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function emptyDb(){return{v:1,recs:[],metas:[],aportes:[],reg:{},onb:false,prem:Object.assign({},PREM_PADRAO),log:[],prog:[],prio:[],investimentos:[]}}
function sum(a){return a.reduce(function(s,r){return s+r.v},0)}

function catIcon(k){for(var i=0;i<CATS.length;i++)if(CATS[i][0]===k)return CATS[i][2];return'•'}

function parseQuick(text,today){
  var t=norm(text||''),raw=String(text||'');
  var data=today;

function valorDe(t){
  var s=t.replace(/\b\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\b/g,' ').replace(/\bdia\s+\d{1,2}\b/g,' ');
  var m=s.match(/\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?/);
  if(!m)return null;
  var a=m[0],ip,fp='';
  if(a.indexOf(',')>=0){var q=a.split(',');ip=q[0].replace(/\./g,'');fp=q[1]}
  else if(/^\d{1,3}(\.\d{3})+$/.test(a))ip=a.replace(/\./g,'');
  else if(a.indexOf('.')>=0){var q2=a.split('.');ip=q2[0];fp=q2[1]}
  else ip=a;
  var v=parseInt(ip,10)*100+(fp?parseInt((fp+'0').slice(0,2),10):0),raw=a;
  var mult=s.slice(m.index+a.length).match(/^\s*(milhoes|milhao|mil|k)\b/);
  if(mult){v*=(mult[1]==='mil'||mult[1]==='k')?1000:1000000;raw=a+mult[0]}
  if(!(v>0)||v>100000000000)return null;
  return{v:v,raw:raw};
}

function rota(p,today){
  var ym=monthOf(today),falta=Math.max(0,p.alvo-p.guardado);
  var r={falta:falta,pct:Math.min(100,Math.floor(p.guardado*100/p.alvo)),status:'sem-aporte',necessario:null,chegaEm:null,mesesParaChegar:null,folgaMeses:null};
  if(falta===0){r.status='concluido';return r}
  var n=p.prazo?monthsBetween(ym,p.prazo):null;
  if(p.prazo)r.necessario=Math.ceil(falta/Math.max(1,n));
  if(p.mensal>0){r.mesesParaChegar=Math.ceil(falta/p.mensal);r.chegaEm=addMonths(ym,r.mesesParaChegar)}
  if(p.prazo&&n<0)r.status='vencido';
  else if(p.prazo&&p.mensal>0){r.folgaMeses=monthsBetween(r.chegaEm,p.prazo);r.status=p.mensal>=r.necessario?'no-ritmo':'atrasado'}

}

function simRF(p,A,cdi,pct){
  var r=Math.pow(1+Math.max(0,cdi)/100*pct/100,1/12)-1,princ=p.guardado,bruto=p.guardado,meses=0,liq=p.guardado;
  if(liq>=p.alvo)return{meses:0,princ:princ,liq:liq};
  while(meses<600){
    meses++;bruto=Math.round(bruto*(1+r))+A;princ+=A;
    liq=princ+Math.round((bruto-princ)*(1-0.225)); // IR no pior caso (22,5%) sobre todo o rendimento
    if(liq>=p.alvo)return{meses:meses,princ:princ,liq:liq};
  }
  return null;
}

function simPP(p,A,pm){

  while(meses<600){meses++;bal=Math.round(bal*(1+r))+A;princ+=A;if(bal>=p.alvo)return{meses:meses,princ:princ,liq:bal}}
  return null;
}

  if(/\b(como (esta|anda|vai)|status|situacao|quanto falta)\b/.test(t)){
    var a3=acharPlano(db,t.replace(/\b(como|esta|anda|vai|status|situacao|quanto|falta|para|do|da|o|a|plano|meta)\b/g,' '));
    if(a3.erro)return{erro:a3.erro};return F('status_plano',{plano:a3.plano.id,planoNome:a3.plano.nome});
  }
  if(/\b(paguei|quitei|pago)\b/.test(t)){
    var d=t.replace(vd?vd.raw:'',' ').replace(/\b(paguei|quitei|pago|a|o|conta|da|do|de|reais|real|r\$)\b/g,' ').replace(/\s+/g,' ').trim();
    var c=contas(db,today),todas=c.atrasadas.concat(c.semana,c.depois),fs=d?todas.filter(function(r){return norm(r.desc).indexOf(d)>=0}):[];
    if(fs.length===1)return F('pagar_conta',{descricao:fs[0].desc,id:fs[0].id});
    if(fs.length>1)return{erro:'Mais de uma conta combina: '+fs.map(function(r){return r.desc}).join(', ')+'. Qual?'};
  }
  if(/\b(minhas contas|contas a pagar|contas da semana|o que vence|quais contas)\b/.test(t))return F('listar_contas',{});
  var q=parseQuick(texto,today);
  if(q)return F('registrar_lancamento',{tipo:q.t,valor:q.v,categoria:q.cat,descricao:q.desc,data:q.data});
  return{erro:'Não entendi. Tente: "gastei 50 no mercado", "quanto posso gastar hoje", "criar plano moto 20 mil em 18 meses" ou "guardei 200 na moto".'};
}

function quandoTxt(min,max,today){
  var ym=monthOf(today),lbl=function(n){var x=addMonths(ym,n);return x.slice(5,7)+'/'+x.slice(0,4)};
  if(min===0&&max===0)return'Agora';
  if(min===max)return'em '+min+(min===1?' mês':' meses')+' ('+lbl(min)+')';
  return'entre '+min+' e '+max+' meses ('+lbl(min)+' a '+lbl(max)+')';
}

function executar(db,today,nome,a,origem){
  a=a||{};var out;
  function ok(msg,dados){return{ok:true,mensagem:msg,fala:msg,dados:dados||null}}
  function no(msg){return{ok:false,mensagem:msg,fala:msg,dados:null}}
  function limiteTxt(){var b=budget(db,today);if(b.semRenda)return'';return b.sobraHoje>=0?' Ainda pode gastar '+fmt(b.sobraHoje)+' hoje.':' Passou '+fmt(-b.sobraHoje)+' do limite de hoje.'}
  switch(nome){
    case'registrar_lancamento':{
      if(!Number.isInteger(a.valor)||a.valor<=0)return no('Valor inválido.');
      var dt=/^\d{4}-\d{2}-\d{2}$/.test(a.data||'')?a.data:today,tp=a.tipo==='r'?'r':'d';
      db.recs.push({id:uid(),t:tp,v:a.valor,cat:tp==='d'?(catLabel(a.categoria)==='Outros'&&a.categoria!=='outros'?'outros':(a.categoria||'outros')):'outros',desc:String(a.descricao||'').slice(0,60),data:dt,st:'real',fixa:false});
      markReg(db,today);out=ok('Registrado: '+(tp==='r'?'entrada':'gasto')+' de '+fmt(a.valor)+'.'+(tp==='d'&&dt===today?limiteTxt():''));break}
    case'consultar_limite_hoje':{
      var b=budget(db,today);
      out=b.semRenda?no('Informe sua renda do mês para eu calcular o limite.'):ok(b.sobraHoje>=0?'Você pode gastar '+fmt(b.sobraHoje)+' hoje (limite de '+fmt(b.limiteDia)+' por dia, restam '+b.diasRest+' dias'+(b.modo==='caixa'?' até você receber de novo, em '+b.proxRenda.slice(8,10)+'/'+b.proxRenda.slice(5,7):'')+').':'Você passou '+fmt(-b.sobraHoje)+' do limite de hoje ('+fmt(b.limiteDia)+').',{limiteDia:b.limiteDia,sobraHoje:b.sobraHoje});break}
    case'posso_comprar':{
      var p=posso(db,today,a.valor);
      if(!p)return no('Informe sua renda do mês para eu calcular.');
      out=ok(p.nivel==='nao'?'Não cabe neste mês: passa '+fmt(p.excede)+'.':(p.nivel==='aperta'?'Cabe, mas aperta: seu limite por dia cai de '+fmt(p.limiteAtual)+' para '+fmt(p.novoLimite)+'.':'Cabe tranquilo: seu limite por dia vai de '+fmt(p.limiteAtual)+' para '+fmt(p.novoLimite)+'.'),p);break}
    case'criar_plano':{
      if(!a.nome||!Number.isInteger(a.alvo)||a.alvo<=0)return no('Informe o nome e o valor do plano.');
      var pr=/^\d{4}-\d{2}$/.test(a.prazo||'')?a.prazo:null,mn=Number.isInteger(a.mensal)&&a.mensal>=0?a.mensal:0;
      db.metas.push({id:uid(),nome:String(a.nome).slice(0,40),alvo:a.alvo,guardado:0,prazo:pr,mensal:mn,feita:false,tipo:TIPOS_PLANO.some(function(t){return t[0]===a.tipo})?a.tipo:tipoDe(a.nome)});
      markReg(db,today);out=ok('Plano "'+a.nome+'" criado.'+(mn?' Guardando '+fmt(mn)+' por mês'+(pr?' você chega no prazo.':'.'):''));break}
    case'guardar_no_plano':{
      var m=db.metas.filter(function(x){return x.id===a.plano})[0];
      if(!m)return no('Plano não encontrado.');if(!Number.isInteger(a.valor)||a.valor<=0)return no('Valor inválido.');
      var feito=guardarNoPlano(db,m,a.valor,today);
      out=ok(feito?'🎉 Plano "'+m.nome+'" alcançado! Parabéns.':'Guardado: '+fmt(a.valor)+' no plano "'+m.nome+'". Falta '+fmt(Math.max(0,m.alvo-m.guardado))+'.');break}
    case'status_plano':{
      var pl=db.metas.filter(function(x){return x.id===a.plano})[0];if(!pl)return no('Plano não encontrado.');
      var r=rota(pl,today),txt;
      if(r.status==='concluido')txt='O plano "'+pl.nome+'" já foi alcançado.';
      else{
        txt='Plano "'+pl.nome+'": '+r.pct+'% guardado, falta '+fmt(r.falta)+'.';
        if(r.status==='no-ritmo')txt+=' No ritmo atual você chega em '+r.chegaEm.slice(5,7)+'/'+r.chegaEm.slice(0,4)+(r.folgaMeses>0?', '+r.folgaMeses+(r.folgaMeses===1?' mês':' meses')+' antes do prazo.':', dentro do prazo.');
        else if(r.status==='atrasado')txt+=' Para chegar no prazo precisa guardar '+fmt(r.necessario)+' por mês e hoje está em '+fmt(pl.mensal)+'.';
        else if(r.status==='vencido')txt+=' O prazo já passou.';
        else if(r.status==='sem-prazo')txt+=' Guardando '+fmt(pl.mensal)+' por mês, chega em '+r.chegaEm.slice(5,7)+'/'+r.chegaEm.slice(0,4)+'.';
        else txt+=' Defina quanto vai guardar por mês'+(pl.prazo?' (para o prazo, precisa de '+fmt(r.necessario)+').':'.');
      }
      out=ok(txt,r);break}
    case'comparar_cenarios':{
      var pc=db.metas.filter(function(x){return x.id===a.plano})[0];if(!pc)return no('Plano não encontrado.');
      var c=cenarios(pc,db.prem,today);if(c.erro)return no(c.erro);
      out=ok(c.itens.map(function(i){return i.nome+': '+quandoTxt(i.min,i.max,today)}).join('. ')+'. '+c.aviso,c);break}
    case'cenario_periodos':{
      var cn=cenario(db,today,3,typeof pjExtras==='function'?pjExtras():[]);
      out=ok((cn.semSaldo?'Sem saldo informado, considero só o que entra e sai daqui para frente. ':'')+cn.periodos.map(function(x){return x.ini.slice(8,10)+'/'+x.ini.slice(5,7)+' a '+x.fim.slice(8,10)+'/'+x.fim.slice(5,7)+': entra '+fmt(x.renda)+', sai '+fmt(x.contas+x.plan+x.reserva+x.proj)+', sobra '+fmt(x.saldoFim)+(x.aperto?' (não fecha)':' (até '+fmt(Math.floor(x.livre/x.dias))+' por dia)')}).join('. ')+'.',cn);break}
    case'quando_posso':{
      if(!Number.isInteger(a.valor)||a.valor<=0)return no('Valor inválido.');
      var cq=cenario(db,today,6,typeof pjExtras==='function'?pjExtras():[]),qp=quandoPosso(cq,a.valor);
      out=!qp.ok?ok('Nos próximos 6 meses não fecha: faltam '+fmt(qp.falta)+' no ponto mais apertado.',qp):qp.indice===0?ok('Dá para fazer hoje: todos os períodos seguem fechando depois de '+fmt(a.valor)+'.',qp):ok('Cabe a partir de '+qp.data.slice(8,10)+'/'+qp.data.slice(5,7)+', quando entra o próximo recebimento.',qp);break}
    case'programar_gasto':{
      if(!a.nome||!Number.isInteger(a.valor)||a.valor<=0)return no('Informe o que é e o valor.');
      var dq=/^\d{4}-\d{2}-\d{2}$/.test(a.data||'')?a.data:null;
      if(!dq){var q2=quandoPosso(cenario(db,today,6,typeof pjExtras==='function'?pjExtras():[]),a.valor);if(!q2.ok)return no('Não cabe nos próximos 6 meses: faltam '+fmt(q2.falta)+'. Diga uma data se quiser programar mesmo assim.');dq=q2.data}
      if(!db.prog)db.prog=[];db.prog.push({id:uid(),nome:String(a.nome).slice(0,40),v:a.valor,data:dq});markReg(db,today);
      out=ok('Programado: "'+a.nome+'" de '+fmt(a.valor)+' para '+dq.slice(8,10)+'/'+dq.slice(5,7)+'. O cenário já considera.');break}
    case'cadastrar_renda':{
      var nr=novaRenda(db,today,{nome:a.nome,tipo:a.tipo||'mensal',v:a.valor,dia:a.dia,data:a.data,recebida:a.recebida===true,partes:(a.partes||[]).map(function(x){return{dia:x.dia,v:x.valor}})});
      if(nr.erro)return no(nr.erro);
      markReg(db,today);out=ok('Renda "'+a.nome+'" cadastrada: '+fmt(nr.total)+(a.tipo==='unica'?'.':' por mês.'));break}
    case'cadastrar_conta_fixa':{
      var nf=novaContaFixa(db,today,{nome:a.nome,v:a.valor,dia:a.dia,pago:typeof a.ja_pagou==='boolean'?a.ja_pagou:null});
      if(nf.erro)return no(nf.erro+(nf.precisaPago?' Ex.: "já paguei" ou "ainda não paguei".':''));
      markReg(db,today);out=ok('Conta fixa "'+a.nome+'" cadastrada: '+fmt(a.valor)+', vence todo dia '+a.dia+'.');break}
    case'resumo_mes':out=ok(resumoMesTxt(db,today));break;
    case'dicas_atlas':{
      var sd=saude(db,today),dc=dicas(db,today);
      out=ok((sd.score==null?'Ainda não dá para calcular sua saúde financeira: '+sd.label.toLowerCase()+'.':'Sua saúde financeira está em '+sd.score+' de 100 ('+sd.label.toLowerCase()+').')+(dc.length?' '+dc.slice(0,3).map(function(d){return d.texto}).join(' '):' Sem alertas agora.')+' São dicas educativas, não recomendação de investimento.',{saude:sd,dicas:dc});break}
    case'listar_contas':{
      var cc=contas(db,today),ab=cc.atrasadas.concat(cc.semana,cc.depois);
      out=ab.length?ok(ab.length+(ab.length===1?' conta a pagar: ':' contas a pagar: ')+ab.slice(0,6).map(function(r){return r.desc+' '+fmt(r.v)+' ('+r.data.slice(8,10)+'/'+r.data.slice(5,7)+')'}).join('; ')+'.',ab):ok('Nenhuma conta a pagar neste mês.');break}
    case'pagar_conta':{
      var rc=db.recs.filter(function(x){return x.id===a.id})[0]||null;
      if(!rc||!rc.fixa||rc.st!=='prev')return no('Não encontrei essa conta em aberto.');
      rc.st='real';markReg(db,today);out=ok('Conta "'+rc.desc+'" marcada como paga.');break}
    default:return no('Ação desconhecida.');
  }
  if(out.ok&&isMuta(nome)||origem==='assistente'){
    db.log=db.log||[];db.log.push({ts:new Date().toISOString(),origem:origem||'usuario',ferramenta:nome,ok:out.ok});if(db.log.length>200)db.log.splice(0,db.log.length-200);
  }
  return out;
}

/* ===== Demonstrativos, saúde financeira e dicas (v3) ===== */
var CAT_COR={mercado:'#1FA971',comida:'#E8A317',transporte:'#3B82C4',casa:'#19376D',saude:'#D14343',lazer:'#1FA9A0',compras:'#C97B2B',educacao:'#6C8EAD',outros:'#9AA9BF',fixas:'#0B2447',planos:'#7BD3A8'};
var NECESSIDADES=['mercado','casa','saude','transporte','educacao'];
var TIPOS_PLANO=[['reserva','🛟','Reserva de emergência'],['compra','🛒','Compra'],['viagem','✈️','Viagem'],['outro','⭐','Outro']];
function tipoIcone(t){for(var i=0;i<TIPOS_PLANO.length;i++)if(TIPOS_PLANO[i][0]===t)return TIPOS_PLANO[i][1];return'⭐'}

function mesResumo(db,ym){
  var r={renda:0,fixas:0,variavel:0,porCat:{},saidas:0,aportes:0};
  db.recs.forEach(function(x){
    if(monthOf(x.data)!==ym)return;
    if(x.t==='r'){r.renda+=x.v;return}
    r.saidas+=x.v;
    if(x.fixa)r.fixas+=x.v;else{r.variavel+=x.v;r.porCat[x.cat]=(r.porCat[x.cat]||0)+x.v}
  });
  (db.aportes||[]).forEach(function(a){if(monthOf(a.data)===ym)r.aportes+=a.v});
  r.sobra=r.renda-r.saidas;
  return r;
}
function serieMeses(db,today,n){
  var out=[],ym0=monthOf(today);
  for(var i=n-1;i>=0;i--){var ym=addMonths(ym0,-i),m=mesResumo(db,ym);out.push({ym:ym,entradas:m.renda,saidas:m.saidas})}
  return out;
}
function mediaVariavel(db,today,n){
  var ym0=monthOf(today),tot=0,cnt=0;
  for(var i=1;i<=n;i++){var m=mesResumo(db,addMonths(ym0,-i));if(m.variavel>0){tot+=m.variavel;cnt++}}
  return cnt?Math.round(tot/cnt):null;
}

function projecao(db,today,n){
  var ym0=monthOf(today),tpl=db.recs.filter(function(r){return r.rec==='m'&&!r.from});
  var rendaRec=sum(tpl.filter(function(t){return t.t==='r'})),fixRec=sum(tpl.filter(function(t){return t.t==='d'&&t.fixa}));
  var media=mediaVariavel(db,today,3),out=[],temRenda=rendaRec>0;
  var ativos=db.metas.filter(function(m){return!m.feita&&m.mensal>0}).map(function(m){return{m:m,fim:rota(m,today).mesesParaChegar}});
  for(var i=1;i<=n;i++){
    var ym=addMonths(ym0,i);
    var umas=db.recs.filter(function(r){return monthOf(r.data)===ym&&!r.rec});
    var renda=rendaRec+sum(umas.filter(function(r){return r.t==='r'}));
    var fixas=fixRec+sum(umas.filter(function(r){return r.t==='d'&&r.fixa}));
    var reserva=ativos.reduce(function(s,a){return s+(i<=a.fim?a.m.mensal:0)},0);
    var sobra=renda-fixas-reserva;
    out.push({ym:ym,renda:renda,fixas:fixas,reserva:reserva,variavelEst:media,sobra:sobra,sobraEst:sobra-(media||0),negativo:sobra-(media||0)<0});
  }
  return{meses:out,semRenda:!temRenda,semMedia:media==null};
}

function saude(db,today){
  var ym=monthOf(today),b=budgetMes(db,today),mr=mesResumo(db,ym),c=contas(db,today),fat=[];
  if(mr.renda>0){
    var poup=Math.max(mr.aportes,b.reserva),pct=poup*100/mr.renda;
    fat.push({id:'poupanca',nome:'Quanto você guarda',pts:Math.min(25,Math.round(pct/20*25)),detalhe:Math.round(pct)+'% da renda (referência comum: 20%)'});
    var folga=b.restante,pts2=folga>=0?25:Math.max(0,Math.round(25*(1-Math.min(1,-folga*10/mr.renda))));
    fat.push({id:'orcamento',nome:'Gastos dentro da renda',pts:pts2,detalhe:folga>=0?'Sobram '+fmt(folga)+' no mês':'Passou '+fmt(-folga)+' do que sobrava'});
  }
  var atr=c.atrasadas.length;
  fat.push({id:'contas',nome:'Contas em dia',pts:Math.max(0,25-8*atr),detalhe:atr?atr+(atr===1?' conta atrasada':' contas atrasadas'):'Nenhuma conta atrasada'});
  var media=mediaVariavel(db,today,3),custo=mr.fixas+(media!=null?media:mr.variavel);
  if(custo>0){
    var res=sum(db.metas.filter(function(m){return m.tipo==='reserva'}).map(function(m){return{v:m.guardado}})),meses=res/custo;
    fat.push({id:'reserva',nome:'Reserva de emergência',pts:Math.min(25,Math.round(meses/6*25)),detalhe:meses.toFixed(1).replace('.',',')+' meses de gastos cobertos (referência comum: 3 a 6)'});
  }
  if(fat.length<3)return{score:null,label:'Informe sua renda para ver',fatores:fat};
  var score=Math.round(fat.reduce(function(s,f){return s+f.pts},0)*100/(25*fat.length));
  return{score:score,label:score>=70?'Saudável':score>=40?'Em construção':'Pede atenção',fatores:fat};
}

function regra503020(db,ym){
  var mr=mesResumo(db,ym),needs=mr.fixas,wants=0;
  for(var k in mr.porCat){if(NECESSIDADES.indexOf(k)>=0)needs+=mr.porCat[k];else wants+=mr.porCat[k]}
  var out={renda:mr.renda,needs:needs,wants:wants,save:mr.aportes};
  if(mr.renda>0){out.pNeeds=Math.round(needs*100/mr.renda);out.pWants=Math.round(wants*100/mr.renda);out.pSave=Math.round(mr.aportes*100/mr.renda)}
  return out;
}

function comparaMes(db,ym){
  var a=mesResumo(db,ym).porCat,b=mesResumo(db,addMonths(ym,-1)).porCat,keys={},out=[];
  for(var k in a)keys[k]=1;for(var k2 in b)keys[k2]=1;
  for(var c in keys){var cur=a[c]||0,prev=b[c]||0;out.push({cat:c,cur:cur,prev:prev,delta:cur-prev,pct:prev>0?Math.round((cur-prev)*100/prev):null})}
  out.sort(function(x,y){return Math.abs(y.delta)-Math.abs(x.delta)});
  return out;
}

function eSe(p,today,extra){
  var r0=rota(p,today);
  if(!(p.mensal>0)||r0.falta===0)return null;
  var n=Math.ceil(r0.falta/(p.mensal+extra));
  return{extra:extra,meses:n,antes:r0.mesesParaChegar-n,chegaEm:addMonths(monthOf(today),n)};
}

function serieEvolucao(p,today){
  var r=rota(p,today),ym0=monthOf(today),nPrazo=p.prazo?Math.max(0,monthsBetween(ym0,p.prazo)):0;
  var N=Math.min(36,Math.max(r.mesesParaChegar||0,nPrazo,1)+1),meses=[],atual=[],nec=[];
  for(var k=0;k<=N;k++){
    meses.push(addMonths(ym0,k));
    atual.push(p.mensal>0?Math.min(p.alvo,p.guardado+p.mensal*k):p.guardado);
    nec.push(r.necessario&&k<=nPrazo?Math.min(p.alvo,p.guardado+r.necessario*k):null);
  }
  return{meses:meses,atual:atual,necessaria:nec};
}
function marcos(p){return[25,50,75,100].map(function(m){return{pct:m,ok:p.guardado*100>=p.alvo*m}})}

function dicas(db,today){
  var ym=monthOf(today),mr=mesResumo(db,ym),b=budget(db,today),c=contas(db,today),out=[];
  function add(n,t){out.push({nivel:n,texto:t})}
  if(c.atrasadas.length)add('warn',c.atrasadas.length+(c.atrasadas.length===1?' conta está atrasada':' contas estão atrasadas')+' ('+fmt(sum(c.atrasadas))+'). Pagar logo evita multa e juros.');
  if(mr.renda>0){
    var pf=Math.round(mr.fixas*100/mr.renda);
    if(pf>50)add('warn','Suas contas fixas somam '+pf+'% da renda. Acima de 50% sobra pouco espaço para guardar e para imprevistos.');
  }
  var cmp=comparaMes(db,ym).filter(function(x){return x.pct!=null&&x.delta>=5000&&x.pct>=30});
  if(cmp.length)add('warn','Você gastou '+cmp[0].pct+'% a mais em '+catLabel(cmp[0].cat)+' que no mês passado ('+fmt(cmp[0].delta)+' a mais).');
  db.metas.filter(function(m){return!m.feita}).forEach(function(m){
    var r=rota(m,today);
    if(r.status==='atrasado'){
      var gap=r.necessario-m.mensal,maior=null,mv=0;
      var pm=mesResumo(db,addMonths(ym,-1)).porCat;for(var k in pm)if(pm[k]>mv){mv=pm[k];maior=k}
      add('info','Plano "'+m.nome+'": faltam '+fmt(gap)+' por mês para chegar no prazo.'+(maior&&mv>=gap?' Para comparar: no mês passado você gastou '+fmt(mv)+' em '+catLabel(maior)+'.':''));
    }else if(r.status==='no-ritmo'&&r.folgaMeses>=2)add('ok','Plano "'+m.nome+'" no ritmo: chega '+r.folgaMeses+' meses antes do prazo.');
    else if(r.status==='sem-aporte')add('info','Defina quanto vai guardar por mês no plano "'+m.nome+'"'+(r.necessario?' (para o prazo, precisa de '+fmt(r.necessario)+').':'.'));
  });
  var s=saude(db,today),fr=s.fatores.filter(function(f){return f.id==='reserva'})[0];
  if(fr&&fr.pts<12&&!db.metas.some(function(m){return m.tipo==='reserva'}))add('info','Você ainda não tem um plano de reserva de emergência. Uma referência comum é cobrir de 3 a 6 meses de gastos.');

/* ===== Prioridades e prestações: o que fazer primeiro e como pagar sem estourar o mês ===== */
var MESES_ABR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* itens: db.prio {id,nome,v,urg 3=urgente 2=importante 1=pode esperar,depois=id,parc={n,p} oferecida pela loja}.
   Base: a sobra mensal estimada (projecao) e o dinheiro livre agora (cenario). Parcela só ocupa o que sobra; sem juros, a menos que a loja informe n x p. */
function planoPrioridades(db,today,H){
  H=H||24;var lista=(db.prio||[]).filter(function(i){return!i.feito});
  if(!lista.length)return{itens:[],vazio:true};
  var pj=projecao(db,today,H);if(pj.semRenda)return{itens:[],semRenda:true};
  var cen=cenario(db,today,3),caixa0=cen.semSaldo||!cen.periodos.length?0:cen.periodos[0].livre,ym0=monthOf(today);
  var cap=[0],livre=[0],k;for(k=1;k<=H;k++){var c=Math.max(0,pj.meses[k-1].sobraEst);cap.push(c);livre.push(c)}
  var gastos=[];

  function minDepois(arr,s){var m=Infinity,i;for(i=s;i<=H;i++)m=Math.min(m,arr[i]);return m}
  /* ordem: respeita "depois de", depois urgência (maior primeiro), depois o mais barato (resolve rápido) */
  var ord=[],pend=lista.slice(),guard=0;
  while(pend.length&&guard++<200){
    var prontos=pend.filter(function(i){return!i.depois||!pend.some(function(o){return o.id===i.depois})});
    if(!prontos.length)prontos=pend.slice();
    prontos.sort(function(a,b){return b.urg-a.urg||a.v-b.v});
    var e=prontos[0];ord.push(e);pend=pend.filter(function(o){return o!==e});
  }
  var res={},out=[];
  ord.forEach(function(it){
    var pre=it.depois?res[it.depois]:null,ini=0,aviso='';
    if(pre){if(pre.modo==='nao-cabe'){out.push(res[it.id]={id:it.id,nome:it.nome,v:it.v,urg:it.urg,modo:'nao-cabe',depoisNome:pre.nome,fimIdx:null,aviso:'Depende de "'+pre.nome+'", que ainda não cabe no seu orçamento.'});return}
      ini=pre.fimIdx+1}
    var sA=null,s,pa=potArr();for(s=Math.max(0,ini);s<=H;s++)if(minDepois(pa,s)>=it.v){sA=s;break}
    var opts=it.parc?[{n:it.parc.n,p:it.parc.p}]:[2,3,4,6,10,12,18,24].filter(function(n){return n<=H}).map(function(n){return{n:n,p:Math.ceil(it.v/n)}});

    var best=null;if(cands.length){var sMin=Math.min.apply(null,cands.map(function(c){return c.st}));
      best=cands.filter(function(c){return c.st<=sMin+1}).sort(function(a,b){return a.n-b.n})[0]}
    var usaAvista=sA!=null&&(sA<=1||(it.urg<3&&sA<=6)||!best);
    var r={id:it.id,nome:it.nome,v:it.v,urg:it.urg,depoisNome:pre?pre.nome:null};
    if(usaAvista){gastos.push({s:sA,v:it.v});r.modo='avista';r.idx=sA;r.fimIdx=sA;r.ym=addMonths(ym0,sA);r.agora=sA===0;r.lojaTotal=it.parc?it.parc.n*it.parc.p:null}

    else{r.modo='nao-cabe';r.fimIdx=null;r.precisaMes=Math.ceil(it.v/H);r.aviso='Não cabe nos próximos '+H+' meses com a sobra de hoje. Seria preciso reservar cerca de R$ '+(Math.ceil(it.v/H)/100).toFixed(2).replace('.',',')+' por mês, ou reduzir o valor.'}

  });

  return{itens:out,total:tot,fimYm:fimMax>=0?addMonths(ym0,fimMax):null,naoCabem:nao,mensal:mensal,caixa0:caixa0,semMedia:pj.semMedia,sobraMes:cap[1]||0,horizonte:H};
}
/* alternativas de um item: custo total = preço + uso mensal (energia, manutenção) × meses de vida considerada */
function compararAlternativas(it,anos){

}

/* panorama do mês: ajuda a decidir a parte no projeto sabendo o que sobra em cada período */
function pjPanorama(ym){
  var rs=db.recs.filter(function(r){return r.t==='r'&&monthOf(r.data)===ym}).sort(function(a,b){return a.data<b.data?-1:1}),
      cs=db.recs.filter(function(r){return r.t==='d'&&r.fixa&&!r.est&&monthOf(r.data)===ym}),
      reserva=db.metas.filter(function(m){return!m.feita}).reduce(function(a,m){return a+(m.mensal||0)},0),
      renda=rs.reduce(function(a,r){return a+r.v},0),fixas=cs.reduce(function(a,r){return a+r.v},0),per=[],antes=0;
  if(rs.length)antes=cs.filter(function(c){return c.data<rs[0].data}).reduce(function(a,c){return a+c.v},0);
  rs.forEach(function(r,i){var fim=rs[i+1]?rs[i+1].data:'9999';var ct=cs.filter(function(c){return c.data>=r.data&&c.data<fim}).reduce(function(a,c){return a+c.v},0);per.push({data:r.data,desc:r.desc||'Renda',renda:r.v,contas:ct,sobra:r.v-ct,ate:rs[i+1]?rs[i+1].data:null})});
  return{renda:renda,fixas:fixas,reserva:reserva,sobra:renda-fixas-reserva,per:per,antes:antes,semContas:!cs.length,semRenda:!rs.length};
}
function pjPanoramaHTML(ym){
  var o=pjPanorama(ym);
  if(o.semRenda||o.semContas)return'<div class="alert warn" style="margin-top:10px">Para decidir com segurança, o app precisa saber o que você recebe e o que paga todo mês. '+(o.semRenda?'Cadastre seus recebimentos. ':'')+(o.semContas?'Cadastre suas contas fixas. ':'')+'<button type="button" class="chip" data-act="'+(o.semContas?'novaconta':'novorec')+'">Fazer agora</button><br>Enquanto isso, você pode só registrar o que colocar, sem definir regra.</div>';
  var h='<div class="card" style="margin:10px 0 0"><h3>Seu mês em números</h3>'+
    [['Você recebe',o.renda,'+'],['Contas fixas',o.fixas,'-'],['Reserva dos seus planos',o.reserva,'-']].map(function(x){return'<div class="leg"><span>'+x[0]+'</span><b style="color:'+(x[2]==='+'?'var(--green)':'var(--ink)')+'">'+(x[2]==='+'?'+ ':'− ')+fmt(x[1])+'</b></div>'}).join('')+
    '<div class="leg" style="border-top:1px solid var(--line);margin-top:4px"><span><b>Sobra no mês</b></span><b>'+fmt(o.sobra)+'</b></div>';
  if(o.antes)h+='<p class="muted" style="margin:8px 0 0">Antes do primeiro recebimento vencem '+fmt(o.antes)+' (saem do saldo que você já tem).</p>';
  h+='<p class="muted" style="margin:8px 0 2px"><b>Por período</b></p>'+o.per.map(function(x){return'<div class="leg"><span>Recebe dia '+x.data.slice(8,10)+' ('+fmt(x.renda)+')<br><small class="muted">paga '+fmt(x.contas)+(x.ate?' até o dia '+x.ate.slice(8,10):' até o fim do mês')+'</small></span><b>sobra '+fmt(x.sobra)+'</b></div>'}).join('');

function toast(msg,label,fn){

}
function openSheet(html){
  $('#toast').hidden=true;
  var s=$('#sheet');if(s.hidden)uiReturnFocus=document.activeElement;
  s.innerHTML='<div class="pn" role="dialog" aria-modal="true" aria-label="Formulário do Atlas">'+html+'</div>';s.hidden=false;
  var pn=s.querySelector('.pn'),heading=pn.querySelector('h2');
  if(heading){heading.id='atlas-dialog-title';pn.setAttribute('aria-labelledby',heading.id);pn.removeAttribute('aria-label')}
  pn.querySelectorAll('label:not([for])').forEach(function(label,i){var input=label.nextElementSibling;if(input&&/^(INPUT|SELECT|TEXTAREA)$/.test(input.tagName)){if(!input.id)input.id='atlas-field-'+i;label.htmlFor=input.id}});
  $('#app').setAttribute('inert','');$('#app').setAttribute('aria-hidden','true');document.body.style.overflow='hidden';
  var i=pn.querySelector('input.money,input[autofocus]')||pn.querySelector('button,input,select,textarea');
  if(i)setTimeout(function(){if(s.contains(i))i.focus()},60);
}
function closeSheet(){
  $('#sheet').hidden=true;$('#sheet').innerHTML='';qf=null;
  $('#app').removeAttribute('inert');$('#app').removeAttribute('aria-hidden');document.body.style.overflow='';
  var target=uiReturnFocus&&uiReturnFocus.isConnected?uiReturnFocus:$('#app button');if(target)target.focus();uiReturnFocus=null;
}
document.addEventListener('keydown',function(e){
  if(e.key!=='Tab'||$('#sheet').hidden)return;
  var controls=Array.from($('#sheet').querySelectorAll('button,input,select,textarea,a[href],[tabindex="0"]')).filter(function(el){return!el.disabled&&el.getClientRects().length});
  if(!controls.length)return;
  var first=controls[0],last=controls[controls.length-1];
  if(e.shiftKey&&(document.activeElement===first||!$('#sheet').contains(document.activeElement))){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&(document.activeElement===last||!$('#sheet').contains(document.activeElement))){e.preventDefault();first.focus()}
});

function uiIcon(name){return '<span class="ui-icon" aria-hidden="true">'+(UI_ICONS[name]||UI_ICONS['journal-text'])+'</span>'}
function uiCategory(cat){return {mercado:'basket',comida:'basket',transporte:'wallet2',casa:'house',saude:'plus-lg',lazer:'bullseye',compras:'basket',educacao:'journal-text'}[cat]||'journal-text'}
function uiTool(action,icon,label,extra){return '<button type="button" class="tool-row" data-act="'+action+'"'+(extra||'')+'>'+uiIcon(icon)+'<span>'+label+'</span>'+uiIcon('chevron-right')+'</button>'}

function recRow(r,today,act){
  var icon=r.t==='r'?'arrow-up-circle':uiCategory(r.cat),late=r.st==='prev'&&r.data<today;
  var sub=(r.t==='r'?'Entrada':catLabel(r.cat))+' · '+shortDate(r.data,today)+(r.st==='prev'?(r.t==='r'?' · prevista':' · a pagar'):'')+(r.rec==='m'?' · todo mês':'');
  return'<button type="button" class="item tap" data-act="'+(act||'edit')+'" data-id="'+esc(r.id)+'"><span class="ic">'+uiIcon(icon)+'</span><span class="tx"><b>'+esc(r.desc||catLabel(r.cat))+'</b><span>'+esc(sub)+'</span></span><span class="vl '+(r.t==='r'?'in':late?'late':'')+'">'+(r.t==='r'?'+':'− ')+fmt(r.v)+'</span></button>';
}

function render(){
  var today=todayStr();
  if(ensureRecurring(db,today))save();
  if(!mesSel)mesSel=monthOf(today);
  var top='<header class="top"><img class="brand" src="logo-financas.svg" alt="Atlas Finanças" width="180" height="55"><div class="top-actions"><button type="button" class="head-action" data-act="gear">'+uiIcon('gear')+'<span>Ajustes</span></button></div></header><div class="status-row">'+nvChip()+'</div>';
  var title={extrato:'Extrato',painel:'Resumo do mês',contas:'Contas',metas:'Seus planos',investimentos:'Investimentos'};
  var body=view==='hoje'?vHoje(today):'<h1 class="page-heading">'+title[view]+'</h1>'+(view==='extrato'?vExtrato(today):view==='painel'?vPainel(today):view==='contas'?vContas(today):view==='investimentos'?'<iframe title="Investimentos Atlas" src="investimentos.html?integrado=1" style="width:100%;height:calc(100dvh - 165px);min-height:570px;border:0;border-radius:18px;background:#f4f7fb"></iframe>':vMetas(today));
  if(view==='hoje')body+='<section class="card" aria-label="Investimentos"><h3>🌱 Fazer crescer</h3><p class="muted">Simule aplicações, compare percentuais do CDI e acompanhe seus investimentos.</p><button type="button" class="btn pri" data-act="nav" data-v="investimentos" style="margin-top:8px">Explorar investimentos →</button></section>';
  var nav='<nav aria-label="Navegação principal"><div class="in">'+[['hoje','house','Início'],['extrato','journal-text','Extrato'],['contas','calendar2-check','Contas'],['metas','bullseye','Planos'],['investimentos','trending-up','Investir']].map(navBtn).join('')+'</div></nav>';
  $('#app').innerHTML=top+'<main id="conteudo">'+body+'</main>'+nav;
}
function navBtn(a){return'<button type="button" data-act="nav" data-v="'+a[0]+'"'+(view===a[0]?' aria-current="page"':'')+' class="'+(view===a[0]?'on':'')+'">'+uiIcon(a[1])+'<span>'+a[2]+'</span></button>'}

function vHoje(today){
  var b=budget(db,today),h='';
  if(b.semRenda){
    h='<section class="today-summary"><div class="summary-top"><h1>Vamos começar?</h1></div><p class="balance-label">Organize seu dinheiro e tire seus planos do papel.</p><p class="balance-date">Informe sua renda para ver uma primeira estimativa.</p><button type="button" class="summary-detail" data-act="setup"><span>Informar minha renda</span>'+uiIcon('chevron-right')+'</button></section>';
  }else{
    var periodo=b.modo==='caixa'?(b.proxSemData?'Próximo recebimento sem data':'Até receber em '+fmt0d(b.proxRenda)):'Com base na renda do mês';
    h='<section class="today-summary" aria-label="Seu resumo de hoje"><div class="summary-top"><h1>Hoje</h1><button type="button" class="text-action privacy" data-act="ui-privacy" aria-label="'+(uiHideDaily?'Mostrar':'Ocultar')+' valor diário" aria-pressed="'+uiHideDaily+'">'+uiIcon(uiHideDaily?'eye-slash':'eye')+'<span>'+(uiHideDaily?'Mostrar':'Ocultar')+'</span></button></div><p class="balance-label">'+(b.sobraHoje<0?'Acima da estimativa de hoje':'Estimativa para gastar')+'</p><b class="balance-value'+(b.sobraHoje<0?' neg':'')+'">'+(uiHideDaily?'<span aria-label="Valor diário oculto">••••</span>':fmt(b.sobraHoje))+'</b><p class="balance-date">'+periodo+'</p><button type="button" class="summary-detail" data-act="ui-calculo"><span>Ver detalhes do cálculo</span>'+uiIcon('chevron-right')+'</button></section>';
  }
  h+='<div class="quick-actions" aria-label="Ações rápidas"><button type="button" class="quick-action" data-act="add">'+uiIcon('plus-lg')+'<span>Registrar</span></button><button type="button" class="quick-action" data-act="addvoz">'+uiIcon('mic')+'<span>Falar</span></button><button type="button" class="quick-action" data-act="novameta">'+uiIcon('bullseye')+'<span>Criar plano</span></button></div>';
  if(b.estourou)h+='<div class="alert bad" role="status">As contas e os planos passam do valor disponível em '+fmt(b.estourou)+'. Confira os detalhes antes de gastar.</div>';
  h+=vCaixaCards(today,b);
  var recentes=db.recs.filter(function(r){return r.st==='real'&&r.data<=today}).sort(function(a,b){return a.data<b.data?1:a.data>b.data?-1:0}).slice(0,3);
  h+='<section class="home-section"><div class="section-heading"><h2>Últimos registros</h2><button type="button" class="text-action" data-act="nav" data-v="extrato">Ver extrato '+uiIcon('chevron-right')+'</button></div>'+(recentes.length?'<div class="home-list">'+recentes.map(function(r){return recRow(r,today)}).join('')+'</div>':'<p class="home-empty">Seus gastos e entradas aparecem aqui. Toque em Registrar para começar.</p>')+'</section>';
  var pendentes=db.recs.filter(function(r){return r.t==='d'&&r.st==='prev'}).sort(function(a,b){return a.data<b.data?-1:a.data>b.data?1:0}),proxima=pendentes[0];
  if(proxima)h+='<section class="home-note'+(proxima.data<today?' late':'')+'"><div class="note-head">'+uiIcon('calendar2-check')+'<div><b>'+(proxima.data<today?'Conta pendente: ':'Próxima conta: ')+esc(proxima.desc||catLabel(proxima.cat))+'</b><p>'+fmt0d(proxima.data)+' · '+fmt(proxima.v)+(proxima.data<today?' · Em atraso':'')+'</p></div><button type="button" class="text-action" data-act="pagar" data-id="'+esc(proxima.id)+'" aria-label="Ver conta '+esc(proxima.desc||catLabel(proxima.cat))+'">Ver '+uiIcon('chevron-right')+'</button></div></section>';
  var ms=db.metas.filter(function(m){return!m.feita}),m=ms[0];
  h+='<section class="home-plan"><div class="section-heading"><h2>Meus planos</h2><button type="button" class="text-action" data-act="nav" data-v="metas">Ver planos '+uiIcon('chevron-right')+'</button></div>'+(m?metaMini(m,today)+'<button type="button" class="text-action" data-act="det" data-id="'+esc(m.id)+'">Acompanhar meu plano '+uiIcon('chevron-right')+'</button>':'<p class="home-empty">Uma compra, uma viagem ou uma reserva: comece pelo que importa para você.</p><button type="button" class="text-action" data-act="novameta">Criar meu primeiro plano '+uiIcon('chevron-right')+'</button>')+'</section>';

/* ---------- gráficos (SVG simples, sem biblioteca) ---------- */
var MES_ABR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmtK(c){var r=Math.round(c/100);return Math.abs(r)>=1000?(r/1000).toFixed(1).replace('.',',')+' mil':String(r)}
function abrMes(ym){return MES_ABR[+ym.slice(5)-1]}
function donutSVG(items,total,size){
  var cx=size/2,r=size/2-16,C=2*Math.PI*r,off=0,h='<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" role="img" aria-label="Para onde foi o dinheiro"><g transform="rotate(-90 '+cx+' '+cx+')"><circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="#E3E9F2" stroke-width="24"/>';
  items.forEach(function(it){var len=C*it.v/total;h+='<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+it.cor+'" stroke-width="24" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';off+=len});
  return h+'</g></svg>';
}
function barsSVG(serie){
  var W=340,H=170,pb=24,pt=10,n=serie.length,gw=W/n,bw=Math.min(22,gw*.32),mx=1;
  serie.forEach(function(s){mx=Math.max(mx,s.entradas,s.saidas)});
  var h='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Entradas e saídas por mês"><line x1="0" y1="'+(H-pb)+'" x2="'+W+'" y2="'+(H-pb)+'" stroke="#E3E9F2"/>';
  serie.forEach(function(s,i){
    var x=i*gw+gw/2,he=(H-pb-pt)*s.entradas/mx,hs=(H-pb-pt)*s.saidas/mx;
    h+='<rect x="'+(x-bw-1)+'" y="'+(H-pb-he)+'" width="'+bw+'" height="'+he+'" rx="4" fill="#1FA971"/><rect x="'+(x+1)+'" y="'+(H-pb-hs)+'" width="'+bw+'" height="'+hs+'" rx="4" fill="#19376D"/><text x="'+x+'" y="'+(H-8)+'" font-size="11" text-anchor="middle" fill="#5B6B85">'+abrMes(s.ym)+'</text>';
  });
  return h+'</svg>';
}
function projSVG(meses){
  var W=340,H=170,n=meses.length,gw=W/n,bw=Math.min(30,gw*.5),mx=1;
  meses.forEach(function(m){mx=Math.max(mx,Math.abs(m.sobraEst))});
  var z=H/2-6,h='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Sobra estimada por mês"><line x1="0" y1="'+z+'" x2="'+W+'" y2="'+z+'" stroke="#9AA9BF"/>';
  meses.forEach(function(m,i){
    var x=i*gw+gw/2,hh=(z-18)*Math.abs(m.sobraEst)/mx,pos=m.sobraEst>=0;
    h+='<rect x="'+(x-bw/2)+'" y="'+(pos?z-hh:z)+'" width="'+bw+'" height="'+Math.max(1,hh)+'" rx="4" fill="'+(pos?'#1FA971':'#D14343')+'"/><text x="'+x+'" y="'+(pos?z-hh-4:z+hh+12)+'" font-size="10" text-anchor="middle" fill="#10213F">'+(pos?'R$ ':'-R$ ')+fmtK(Math.abs(m.sobraEst))+'</text><text x="'+x+'" y="'+(H-6)+'" font-size="11" text-anchor="middle" fill="#5B6B85">'+abrMes(m.ym)+'</text>';
  });
  return h+'</svg>';
}
function lineSVG(ev,alvo){
  var W=340,H=160,px=8,pt=12,pb=22,n=ev.meses.length-1||1,sx=function(i){return px+(W-2*px)*i/n},sy=function(v){return pt+(H-pt-pb)*(1-Math.min(1,v/alvo))};
  function path(arr){var d='',on=false;arr.forEach(function(v,i){if(v==null){on=false;return}d+=(on?'L':'M')+sx(i).toFixed(1)+' '+sy(v).toFixed(1)+' ';on=true});return d}
  var h='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Caminho até o plano"><line x1="'+px+'" y1="'+sy(alvo)+'" x2="'+(W-px)+'" y2="'+sy(alvo)+'" stroke="#E8A317" stroke-dasharray="5 4"/>';
  h+='<path d="'+path(ev.necessaria)+'" fill="none" stroke="#9AA9BF" stroke-width="2" stroke-dasharray="4 4"/><path d="'+path(ev.atual)+'" fill="none" stroke="#1FA971" stroke-width="3" stroke-linecap="round"/>';
  h+='<text x="'+px+'" y="'+(H-6)+'" font-size="11" fill="#5B6B85">'+abrMes(ev.meses[0])+'</text><text x="'+(W-px)+'" y="'+(H-6)+'" font-size="11" text-anchor="end" fill="#5B6B85">'+abrMes(ev.meses[ev.meses.length-1])+'/'+ev.meses[ev.meses.length-1].slice(2,4)+'</text><text x="'+(W-px)+'" y="'+(sy(alvo)-4)+'" font-size="10" text-anchor="end" fill="#C98A0B">objetivo '+fmtK(alvo)+'</text></svg>';
  return h;
}
function ringSVG(pct,cor,size){

  return'<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" role="img" aria-label="Saúde financeira"><g transform="rotate(-90 '+cx+' '+cx+')"><circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="#E3E9F2" stroke-width="12"/><circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+cor+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(C*pct/100).toFixed(1)+' '+C.toFixed(1)+'"/></g></svg>';

function readPrem(){
  document.querySelectorAll('input[data-prem]').forEach(function(i){
    var k=i.getAttribute('data-prem'),v=parseFloat(String(i.value).replace(',','.'));
    if(!isFinite(v)||v<0)return;
    var lim={consN:[12,360],contMin:[1,360],finN:[1,360],pctCdi:[0,300],cdi:[0,100],consAdm:[0,100],consFundo:[0,100],finJuros:[0,30]}[k]||[0,1000];
    db.prem[k]=Math.min(lim[1],Math.max(lim[0],v));
  });
  save();
}

  if(i.id==='renda-fixa')return'Você deposita '+fmt(i.sai)+' e o rendimento líquido estimado é de '+fmt(i.ganho)+'.';
